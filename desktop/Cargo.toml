[package]
name = "minesport-desktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
build = "build.rs"

[dependencies]
anyhow = "1.0"
rfd = "=0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }

[build-dependencies]
slint-build = "=1.17.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
