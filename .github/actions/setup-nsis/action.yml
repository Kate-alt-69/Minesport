name: Setup NSIS
description: Install and verify the pinned NSIS compiler for Windows packaging.
inputs:
  version:
    description: NSIS version to install.
    required: false
    default: "3.13"
runs:
  using: composite
  steps:
    - name: Install NSIS
      uses: nsis-dev/setup-nsis@99783963764acafc24a5e3335ddfce26d03c20a2 # v1
      with:
        version: "${{ inputs.version }}"
    - name: Verify NSIS and prepare installer output
      shell: pwsh
      run: |
        $makensis = (Get-Command makensis.exe -ErrorAction Stop).Source
        & $makensis -VERSION
        if ($LASTEXITCODE -ne 0) { throw 'NSIS compiler verification failed.' }
        "NSIS_EXE=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'dist\installer') | Out-Null
