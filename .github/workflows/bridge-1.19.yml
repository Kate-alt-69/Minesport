name: Minesport Fabric Bridge 1.19 Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'minesport-bridge-fabric/**'
      - 'minesport-bridge-fabric-versions/**'
      - 'desktop/src/bridge_build.rs'
      - 'desktop/src/bridge_compat.rs'
      - 'desktop/src/toolchain.rs'
      - 'desktop/src/bin/bridge-prepare.rs'
      - 'desktop/build.rs'
      - 'desktop/Cargo.toml'
      - '.github/workflows/bridge-1.19.yml'
  pull_request:
    branches: [main]
    paths:
      - 'minesport-bridge-fabric/**'
      - 'minesport-bridge-fabric-versions/**'
      - 'desktop/src/bridge_build.rs'
      - 'desktop/src/bridge_compat.rs'
      - 'desktop/src/toolchain.rs'
      - 'desktop/src/bin/bridge-prepare.rs'
      - 'desktop/build.rs'
      - 'desktop/Cargo.toml'
      - '.github/workflows/bridge-1.19.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minesport-bridge-fabric-119-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-1-19:
    name: Fabric Rust recipe · Minecraft ${{ matrix.minecraft }} · Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        minecraft: ['1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Rust/Slint build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - name: Generate and compile from canonical Fabric Bridge with Rust
        env:
          MINESPORT_HEADLESS_BRIDGE_PREPARE: '1'
        run: |
          cargo run --manifest-path desktop/Cargo.toml --bin bridge-prepare -- \
            --loader fabric \
            --version '${{ matrix.minecraft }}' \
            --output dist/recipe-bridges
          test -s "dist/recipe-bridges/minesport-bridge-fabric-${{ matrix.minecraft }}.jar"
      - uses: actions/upload-artifact@v7
        with:
          name: minesport-bridge-fabric-${{ matrix.minecraft }}
          path: dist/recipe-bridges/*.jar
          if-no-files-found: error
          retention-days: 7

  bridge-1-19-clean:
    name: Minecraft 1.19 Fabric recipe family compiles
    if: always()
    needs: bridge-1-19
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete matrix
        env:
          RESULT: ${{ needs.bridge-1-19.result }}
        run: |
          echo "1.19 Fabric Bridge matrix result: $RESULT"
          test "$RESULT" = success
