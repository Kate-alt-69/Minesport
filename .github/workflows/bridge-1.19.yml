name: Minesport Bridge 1.19 Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'bridge-versions/**'
      - 'wrapper/bridgecompat/**'
      - 'wrapper/cmd/bridge-prepare/**'
      - '.github/workflows/bridge-1.19.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'bridge-versions/**'
      - 'wrapper/bridgecompat/**'
      - 'wrapper/cmd/bridge-prepare/**'
      - '.github/workflows/bridge-1.19.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minesport-bridge-119-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-1-19:
    name: Bridge · Minecraft ${{ matrix.minecraft }} · Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        minecraft: ['1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v7
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate and compile from canonical 1.21.10 bridge source
        working-directory: wrapper
        env:
          MINESPORT_BRIDGE_REPO_ROOT: ${{ github.workspace }}
          MINESPORT_BRIDGE_DATA: ${{ runner.temp }}/minesport-bridge-data
        run: |
          go run ./cmd/bridge-prepare \
            -version '${{ matrix.minecraft }}' \
            -output ../dist/recipe-bridges
      - uses: actions/upload-artifact@v7
        with:
          name: minesport-bridge-${{ matrix.minecraft }}
          path: dist/recipe-bridges/*.jar
          if-no-files-found: error
          retention-days: 7

  bridge-1-19-clean:
    name: Minecraft 1.19 bridge family compiles
    if: always()
    needs: bridge-1-19
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete matrix
        env:
          RESULT: ${{ needs.bridge-1-19.result }}
        run: |
          echo "1.19 bridge matrix result: $RESULT"
          test "$RESULT" = success
