name: One Shot Engine Restart Health

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-engine-restart-health.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minesport-engine-restart-health
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Patch engine restart health checks
        shell: pwsh
        run: python .github/engine_restart_health_patch.py

      - name: Remove one-shot integration files
        shell: pwsh
        run: |
          Remove-Item -Force .github/engine_restart_health_patch.py
          Remove-Item -Force .github/workflows/one-shot-engine-restart-health.yml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Format and validate patch
        shell: pwsh
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --all
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          if (-not (Select-String -Quiet -Path desktop/src/ipc.rs -SimpleMatch 'pub fn ping_confirmed')) { throw 'confirmed ping API missing' }
          if (-not (Select-String -Quiet -Path desktop/src/ipc.rs -SimpleMatch 'EngineSidecarRespawnFailedFallback')) { throw 'restart sidecar fallback missing' }
          if (-not (Select-String -Quiet -Path desktop/src/ipc.rs -SimpleMatch 'pong_count.fetch_add')) { throw 'pong observation missing' }
          if (-not (Select-String -Quiet -Path desktop/src/app.rs -SimpleMatch 'ping_confirmed(Duration::from_secs(10))')) { throw 'recovery still trusts ping write only' }

      - name: Test Windows engine restart health
        shell: pwsh
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          cargo test --locked --manifest-path desktop/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Windows all-target tests failed' }
          cargo check --locked --release --manifest-path desktop/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Windows release check failed' }

      - name: Commit tested fixes with collision-free IDs
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git stash push -u -m engine-restart-health-tested
          git pull --rebase origin main
          git stash pop
          if ($LASTEXITCODE -ne 0) { throw 'tested patch no longer rebases cleanly on current main' }

          $subjects = git log origin/main --format=%s
          $ids = [regex]::Matches(($subjects -join "`n"), 'BUG-(\d+)') | ForEach-Object { [int]$_.Groups[1].Value }
          $max = if ($ids) { ($ids | Measure-Object -Maximum).Maximum } else { 0 }
          $first = $max + 1
          $second = $max + 2

          git add desktop/src/ipc.rs
          git diff --cached --check
          git commit -m "FIX | BUG-$first Fall back when engine sidecar restart fails"

          git add desktop/src/app.rs .github/engine_restart_health_patch.py .github/workflows/one-shot-engine-restart-health.yml
          git diff --cached --check
          git commit -m "FIX | BUG-$second Require confirmed engine restart health"
          git push origin HEAD:main
