name: One Shot Engine Runtime Hardening

on:
  push:
    branches: [main]
    paths:
      - ".github/bug094_095_patch.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Patch engine and runtime contracts
        shell: pwsh
        run: python .github/bug094_095_patch.py

      - name: Remove one-shot integration files
        shell: pwsh
        run: |
          Remove-Item -Force .github/bug094_095_patch.py
          Remove-Item -Force .github/workflows/one-shot-bug-094-095-runtime-hardening.yml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - uses: gradle/actions/setup-gradle@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Format and validate source patch
        shell: pwsh
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml
          git diff --check
          if (Select-String -Quiet -Path engine/src/main/java/dev/kastrick/minesport/IpcMode.java -SimpleMatch 'json.addProperty("version", "0.2.1")') { throw 'hardcoded Java IPC version survived' }
          if (-not (Select-String -Quiet -Path desktop/build.rs -SimpleMatch 'minesport-engine-{version}.jar')) { throw 'exact engine JAR selector missing' }
          if (-not (Select-String -Quiet -Path desktop/build.rs -SimpleMatch 'join("VERSION")')) { throw 'engine VERSION rerun dependency missing' }
          if (-not (Select-String -Quiet -Path desktop/src/runtime_cache.rs -SimpleMatch 'RuntimeRegistryListenerPanicked')) { throw 'listener panic fence missing' }

      - name: Build and test Java engine identity
        shell: pwsh
        working-directory: engine
        run: |
          .\gradlew.bat --no-daemon --stacktrace clean test jar
          $version = (Get-Content VERSION -Raw).Trim()
          $jar = (Resolve-Path "build/libs/minesport-engine-$version.jar").Path
          $stdin = Join-Path $env:RUNNER_TEMP 'minesport-ipc-stdin.txt'
          $stdout = Join-Path $env:RUNNER_TEMP 'minesport-ipc-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'minesport-ipc-stderr.txt'
          Set-Content -Path $stdin -Encoding utf8NoBOM -Value '{"command":"quit"}'
          $process = Start-Process -FilePath java -ArgumentList @('-jar', $jar, '--ipc') -RedirectStandardInput $stdin -RedirectStandardOutput $stdout -RedirectStandardError $stderr -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "engine IPC identity probe exited $($process.ExitCode): $(Get-Content $stderr -Raw)" }
          $line = Get-Content $stdout | Where-Object { $_.Trim().StartsWith('{') } | Select-Object -First 1
          if (-not $line) { throw 'engine IPC identity probe emitted no JSON info line' }
          $info = $line | ConvertFrom-Json
          if ($info.version -ne $version) { throw "engine IPC reported $($info.version), expected $version" }

      - name: Prove Cargo chooses exact engine JAR
        shell: pwsh
        run: |
          $version = (Get-Content engine/VERSION -Raw).Trim()
          $expectedJar = (Resolve-Path "engine/build/libs/minesport-engine-$version.jar").Path
          Set-Content -Path engine/build/libs/minesport-engine-9.9.9.jar -Encoding ascii -Value 'lexical-decoy'
          $env:MINESPORT_EXPORT_WORKER_FABRIC_JAR = $expectedJar
          $env:MINESPORT_EXPORT_WORKER_FORGE_JAR = $expectedJar
          $env:MINESPORT_EXPORT_WORKER_NEOFORGE_JAR = $expectedJar
          $env:MINESPORT_EXPORT_WORKER_QUILT_JAR = $expectedJar
          Remove-Item Env:MINESPORT_FAST_CHECK -ErrorAction SilentlyContinue
          Remove-Item Env:MINESPORT_ENGINE_JAR -ErrorAction SilentlyContinue
          cargo check --locked --manifest-path desktop/Cargo.toml --bin minesport-engine
          if ($LASTEXITCODE -ne 0) { throw 'Cargo exact-engine build check failed' }
          $embedded = Get-ChildItem desktop/target/debug/build/minesport-desktop-*/out/minesport-engine.jar | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $embedded) { throw 'could not locate embedded engine payload from Cargo build' }
          $expectedHash = (Get-FileHash $expectedJar -Algorithm SHA256).Hash
          $actualHash = (Get-FileHash $embedded.FullName -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "Cargo embedded wrong engine JAR: $($embedded.FullName)" }

      - name: Test Rust runtime lifecycle
        shell: pwsh
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          cargo test --locked --manifest-path desktop/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Rust all-target tests failed' }
          cargo check --locked --release --manifest-path desktop/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Rust release check failed' }

      - name: Commit tested fixes with collision-free IDs
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked -m engine-runtime-hardening
          git pull --rebase origin main
          git stash pop
          $subjects = git log origin/main --format=%s
          $ids = [regex]::Matches(($subjects -join "`n"), 'BUG-(\d+)') | ForEach-Object { [int]$_.Groups[1].Value }
          $maxId = if ($ids) { ($ids | Measure-Object -Maximum).Maximum } else { 0 }
          $identityId = $maxId + 1
          $listenerId = $maxId + 2
          git add engine/src/main/java/dev/kastrick/minesport/IpcMode.java desktop/build.rs
          git diff --cached --check
          git commit -m "FIX | BUG-$identityId Align Java and Cargo engine identity"
          git add desktop/src/runtime_cache.rs .github/bug094_095_patch.py .github/workflows/one-shot-bug-094-095-runtime-hardening.yml
          git diff --cached --check
          git commit -m "FIX | BUG-$listenerId Contain runtime registry listener panics"
          git push origin HEAD:main
