name: One Shot Litematica + Fresh Build Landing

on:
  push:
    branches: [ main ]
    paths:
      - '.github/litematic_fresh_landing.py'
      - '.github/workflows/one-shot-litematic-fresh.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - name: Apply permanent integration
        run: python .github/litematic_fresh_landing.py

      - name: Test Java engine
        working-directory: engine
        run: bash ./gradlew --no-daemon test --stacktrace

      - name: Validate build scripts
        shell: bash
        run: |
          bash -n build.sh
          pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "build.ps1"), [ref]$null, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          grep -F -- '--rerun-tasks --no-build-cache' build.ps1 >/dev/null
          grep -F -- '--rerun-tasks --no-build-cache' build.sh >/dev/null
          grep -F -- "Join-Path \$Root '.gradle'" build.ps1 >/dev/null
          grep -F -- '"$ROOT/.gradle"' build.sh >/dev/null

      - name: Verify intended diff
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              'build.ps1',
              'build.sh',
              'engine/src/main/java/dev/kastrick/minesport/IpcMode.java',
              'engine/src/main/java/dev/kastrick/minesport/export/LitematicExporter.java',
              'engine/src/main/java/dev/kastrick/minesport/region/RegionReader.java',
              'engine/src/main/java/dev/kastrick/minesport/region/ScheduledTickData.java',
              'engine/src/test/java/dev/kastrick/minesport/export/LitematicTickExporterTest.java',
              'engine/src/test/java/dev/kastrick/minesport/region/RegionReaderScheduledTickTest.java',
          }
          tracked = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          actual = tracked | untracked
          if actual != expected:
              raise SystemExit(f'Unexpected changed files: {sorted(actual)}')
          PY

      - name: Publish tested integration
        shell: bash
        run: |
          rm -f .github/litematic_fresh_landing.py
          rm -f .github/litematic_ticks_patch.py
          rm -f .github/litematic_ticks_fix.py
          rm -f .github/workflows/one-shot-litematic-fresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve Litematica ticks and harden fresh builds'
          git push origin HEAD:main
