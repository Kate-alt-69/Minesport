name: One Shot Scoped Runtime Registry

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: one-shot-scoped-runtime-registry
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.head_commit.message == 'CHORE | stage scoped runtime registry'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Install desktop test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev libudev-dev \
            libgl1-mesa-dev libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev xvfb

      - name: Restore embedded engine artifact
        uses: actions/download-artifact@v7
        with:
          name: minesport-engine-ci
          path: engine/build/libs
          run-id: 33797953559
          github-token: ${{ github.token }}

      - name: Restore embedded 1.21.10 loader bridges
        uses: actions/download-artifact@v7
        with:
          name: loader-bridges-1.21.10
          path: dist/bundled-export-worker
          run-id: 33797953559
          github-token: ${{ github.token }}

      - name: Apply namespace-scoped runtime registry patch
        shell: bash
        run: |
          python .github/patches/apply-runtime-scope.py
          rustfmt desktop/src/runtime_worker.rs desktop/src/runtime_cache.rs desktop/src/app.rs
          git diff --check

      - name: Test scoped runtime registry
        shell: bash
        run: |
          xvfb-run -a cargo test --manifest-path desktop/Cargo.toml --all-targets

      - name: Publish tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git stash push -m scoped-runtime-registry-tested
          git pull --rebase origin main
          git stash pop
          git diff --check

          rm -f .github/workflows/one-shot-scoped-runtime-registry.yml
          rm -f .github/patches/apply-runtime-scope.py

          subjects="$(git log origin/main --format=%s)"
          max="$(printf '%s\n' "$subjects" | grep -oE 'BUG-[0-9]+' | cut -d- -f2 | sort -n | tail -1)"
          next=$(( ${max:-0} + 1 ))

          git add desktop/src/runtime_worker.rs desktop/src/runtime_cache.rs desktop/src/app.rs \
            .github/workflows/one-shot-scoped-runtime-registry.yml \
            .github/patches/apply-runtime-scope.py
          git commit -m "FIX | BUG-${next} Scope runtime registry to selected namespaces"
          git push origin HEAD:main
