name: One Shot Resolver Lifecycle

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-resolver-lifecycle.yml"
      - ".github/resolver_lifecycle_fix.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: |
          python3 -m py_compile .github/resolver_lifecycle_fix.py
          python3 .github/resolver_lifecycle_fix.py
          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"

      - name: Test Java engine
        working-directory: engine
        run: bash ./gradlew --no-daemon test

      - name: Commit tested source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engine/src/main/java/dev/kastrick/minesport/IpcMode.java \
            engine/src/main/java/dev/kastrick/minesport/resolver/AssetResolver.java \
            engine/src/main/java/dev/kastrick/minesport/resolver/ResolverChain.java \
            engine/src/main/java/dev/kastrick/minesport/resolver/VanillaResolver.java \
            engine/src/test/java/dev/kastrick/minesport/resolver/ResolverChainLifecycleTest.java
          git diff --cached --check
          git commit -m "FIX | BUG-062 Close export resolver resources"
          git push origin HEAD:main
