name: One-shot BUG-094 preview topology

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-bug-094-preview-topology.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minesport-one-shot-bug-094
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply exact preview topology patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('desktop/src/preview.rs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '    raycast_occupied: Arc<HashSet<[i32; 3]>>,\n',
              '',
              'remove sampled raycast occupancy',
          )
          replace_once(
              '            &self.raycast_occupied,\n',
              '            &self.scene.occupied,\n',
              'raycast full scene occupancy',
          )

          helper = r'''fn is_surface_block(block: &PreviewBlock, occupied: &HashSet<[i32; 3]>) -> bool {
              CUBE_FACES.iter().any(|face| {
                  !occupied.contains(&[
                      block.x + face.neighbor[0],
                      block.y + face.neighbor[1],
                      block.z + face.neighbor[2],
                  ])
              })
          }

          fn select_render_blocks<'a>(scene: &'a PreviewScene, limit: usize) -> Vec<&'a PreviewBlock> {
              let limit = limit.max(1);
              let mut render_blocks: Vec<&PreviewBlock> = if scene.blocks.len() <= limit {
                  scene.blocks.iter().collect()
              } else {
                  scene
                      .blocks
                      .iter()
                      .filter(|block| is_surface_block(block, &scene.occupied))
                      .collect()
              };
              render_blocks.sort_by_key(|block| (block.x + block.z, block.y, block.x));
              if render_blocks.len() > limit {
                  let stride = render_blocks.len().div_ceil(limit);
                  render_blocks = render_blocks
                      .into_iter()
                      .step_by(stride)
                      .take(limit)
                      .collect();
              }
              render_blocks
          }

          '''
          replace_once(
              'fn render_scene(\n',
              helper + 'fn render_scene(\n',
              'insert surface-first preview budget',
          )

          old_budget = '''    let mut render_blocks: Vec<&PreviewBlock> = scene.blocks.iter().collect();
              render_blocks.sort_by_key(|block| (block.x + block.z, block.y, block.x));
              if render_blocks.len() > MAX_PREVIEW_BLOCKS {
                  let stride = render_blocks.len().div_ceil(MAX_PREVIEW_BLOCKS);
                  render_blocks = render_blocks.into_iter().step_by(stride).collect();
              }

              let rendered_occupied = Arc::new(
                  render_blocks
                      .iter()
                      .map(|block| [block.x, block.y, block.z])
                      .collect::<HashSet<[i32; 3]>>(),
              );

              let min_x = render_blocks.iter().map(|block| block.x).min().unwrap_or(0);
              let max_x = render_blocks.iter().map(|block| block.x).max().unwrap_or(0);
              let min_y = render_blocks.iter().map(|block| block.y).min().unwrap_or(0);
              let max_y = render_blocks.iter().map(|block| block.y).max().unwrap_or(0);
              let min_z = render_blocks.iter().map(|block| block.z).min().unwrap_or(0);
              let max_z = render_blocks.iter().map(|block| block.z).max().unwrap_or(0);
          '''
          new_budget = '''    let render_blocks = select_render_blocks(&scene, MAX_PREVIEW_BLOCKS);

              // Camera framing and picking must describe the complete scene, not
              // whichever surface blocks happened to fit the draw budget.
              let min_x = scene.blocks.iter().map(|block| block.x).min().unwrap_or(0);
              let max_x = scene.blocks.iter().map(|block| block.x).max().unwrap_or(0);
              let min_y = scene.blocks.iter().map(|block| block.y).min().unwrap_or(0);
              let max_y = scene.blocks.iter().map(|block| block.y).max().unwrap_or(0);
              let min_z = scene.blocks.iter().map(|block| block.z).min().unwrap_or(0);
              let max_z = scene.blocks.iter().map(|block| block.z).max().unwrap_or(0);
          '''
          replace_once(old_budget, new_budget, 'replace stride-only preview budget')
          replace_once(
              '            if rendered_occupied.contains(&neighbor) {\n',
              '            if scene.occupied.contains(&neighbor) {\n',
              'cull against full scene occupancy',
          )
          replace_once(
              '            raycast_occupied: rendered_occupied,\n',
              '',
              'remove sampled occupancy from pick map',
          )

          test_anchor = '''    #[test]
              fn shading_clamps() {
          '''
          tests = r'''    fn test_block(x: i32, y: i32, z: i32) -> PreviewBlock {
              PreviewBlock {
                  x,
                  y,
                  z,
                  id: "minecraft:stone".to_string(),
                  texture_top: String::new(),
                  texture_side: String::new(),
                  texture_bottom: String::new(),
                  r: 120,
                  g: 120,
                  b: 120,
              }
          }

          fn test_scene(blocks: Vec<PreviewBlock>) -> PreviewScene {
              let occupied = blocks
                  .iter()
                  .map(|block| [block.x, block.y, block.z])
                  .collect::<HashSet<_>>();
              PreviewScene {
                  blocks,
                  by_id: HashMap::new(),
                  by_position: HashMap::new(),
                  occupied,
                  texture_cache: Mutex::new(HashMap::new()),
              }
          }

          #[test]
          fn preview_surface_detection_excludes_buried_blocks() {
              let mut blocks = Vec::new();
              for x in 0..3 {
                  for y in 0..3 {
                      for z in 0..3 {
                          blocks.push(test_block(x, y, z));
                      }
                  }
              }
              let scene = test_scene(blocks);
              let center = scene
                  .blocks
                  .iter()
                  .find(|block| (block.x, block.y, block.z) == (1, 1, 1))
                  .unwrap();
              let corner = scene
                  .blocks
                  .iter()
                  .find(|block| (block.x, block.y, block.z) == (0, 0, 0))
                  .unwrap();
              assert!(!is_surface_block(center, &scene.occupied));
              assert!(is_surface_block(corner, &scene.occupied));
          }

          #[test]
          fn constrained_preview_budget_spends_slots_on_surface_blocks() {
              let mut blocks = Vec::new();
              for x in 0..4 {
                  for y in 0..4 {
                      for z in 0..4 {
                          blocks.push(test_block(x, y, z));
                      }
                  }
              }
              let scene = test_scene(blocks);
              let selected = select_render_blocks(&scene, 10);
              assert_eq!(selected.len(), 10);
              assert!(selected
                  .iter()
                  .all(|block| is_surface_block(block, &scene.occupied)));
          }

          #[test]
              fn shading_clamps() {
          '''
          replace_once(test_anchor, tests, 'add preview topology regressions')

          path.write_text(text, encoding='utf-8')
          PY

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Format and validate patch anchors
        shell: bash
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --all
          git diff --check
          ! grep -q 'raycast_occupied:' desktop/src/preview.rs
          ! grep -q 'rendered_occupied' desktop/src/preview.rs
          grep -q 'select_render_blocks(&scene, MAX_PREVIEW_BLOCKS)' desktop/src/preview.rs
          grep -q '&self.scene.occupied' desktop/src/preview.rs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build embedded Java engine
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace jar

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build embedded loader workers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bundled-export-worker
          build_bridge() {
            local project="$1"
            local slug="$2"
            chmod +x "$project/gradlew"
            (cd "$project" && ./gradlew --no-daemon --stacktrace build)
            local jar
            jar="$(find "$project/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
            test -n "$jar"
            cp "$jar" "dist/bundled-export-worker/minesport_export_worker-${slug}-1.21.10.jar"
          }
          build_bridge minesport-bridge-fabric fabric
          build_bridge minesport-bridge-forge forge
          build_bridge minesport-bridge-neoforge neoforge
          build_bridge minesport-bridge-quilt quilt

      - name: Install Slint test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev xvfb

      - name: Run Rust + Slint contract
        run: xvfb-run -a cargo test --manifest-path desktop/Cargo.toml --all-targets

      - name: Publish verified BUG-094 and remove one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Kate
          git config user.email dhwanksh2000@gmail.com
          git rm .github/workflows/one-shot-bug-094-preview-topology.yml
          git add desktop/src/preview.rs
          git diff --cached --check
          git commit -m 'FIX | BUG-094 Preserve full preview topology'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git push origin --delete __temp_should_not_exist__ || true
