name: One-shot BUG-094 preview topology publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-bug-094-preview-topology.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minesport-one-shot-bug-094-publish
  cancel-in-progress: false

jobs:
  publish-verified-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tested preview source is unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object desktop/src/preview.rs)" = "0a786458014c64aaefee9614376f421d36a153c4"

      - name: Reapply verified BUG-094 patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('desktop/src/preview.rs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once('    raycast_occupied: Arc<HashSet<[i32; 3]>>,\n', '', 'pick-map occupancy field')
          replace_once('            &self.raycast_occupied,\n', '            &self.scene.occupied,\n', 'full-scene raycast')

          helper = '''fn is_surface_block(block: &PreviewBlock, occupied: &HashSet<[i32; 3]>) -> bool {
              CUBE_FACES.iter().any(|face| {
                  !occupied.contains(&[
                      block.x + face.neighbor[0],
                      block.y + face.neighbor[1],
                      block.z + face.neighbor[2],
                  ])
              })
          }

          fn select_render_blocks<'a>(scene: &'a PreviewScene, limit: usize) -> Vec<&'a PreviewBlock> {
              let limit = limit.max(1);
              let mut render_blocks: Vec<&PreviewBlock> = if scene.blocks.len() <= limit {
                  scene.blocks.iter().collect()
              } else {
                  scene
                      .blocks
                      .iter()
                      .filter(|block| is_surface_block(block, &scene.occupied))
                      .collect()
              };
              render_blocks.sort_by_key(|block| (block.x + block.z, block.y, block.x));
              if render_blocks.len() > limit {
                  let stride = render_blocks.len().div_ceil(limit);
                  render_blocks = render_blocks
                      .into_iter()
                      .step_by(stride)
                      .take(limit)
                      .collect();
              }
              render_blocks
          }

          '''
          replace_once('fn render_scene(\n', helper + 'fn render_scene(\n', 'surface-budget helper')

          pattern = re.compile(
              r'    let mut render_blocks: Vec<&PreviewBlock> = scene\.blocks\.iter\(\)\.collect\(\);\n'
              r'.*?'
              r'    let max_z = render_blocks\.iter\(\)\.map\(\|block\| block\.z\)\.max\(\)\.unwrap_or\(0\);\n',
              re.S,
          )
          replacement = '''    let render_blocks = select_render_blocks(&scene, MAX_PREVIEW_BLOCKS);

              // Camera framing and picking must describe the complete scene, not
              // whichever surface blocks happened to fit the draw budget.
              let min_x = scene.blocks.iter().map(|block| block.x).min().unwrap_or(0);
              let max_x = scene.blocks.iter().map(|block| block.x).max().unwrap_or(0);
              let min_y = scene.blocks.iter().map(|block| block.y).min().unwrap_or(0);
              let max_y = scene.blocks.iter().map(|block| block.y).max().unwrap_or(0);
              let min_z = scene.blocks.iter().map(|block| block.z).min().unwrap_or(0);
              let max_z = scene.blocks.iter().map(|block| block.z).max().unwrap_or(0);
          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'preview render budget: expected one match, found {count}')

          replace_once('            if rendered_occupied.contains(&neighbor) {\n', '            if scene.occupied.contains(&neighbor) {\n', 'full-scene culling')
          replace_once('            raycast_occupied: rendered_occupied,\n', '', 'pick-map sampled occupancy assignment')

          anchor = '''    #[test]
              fn shading_clamps() {
          '''
          tests = '''    fn test_block(x: i32, y: i32, z: i32) -> PreviewBlock {
              PreviewBlock {
                  x,
                  y,
                  z,
                  id: "minecraft:stone".to_string(),
                  texture_top: String::new(),
                  texture_side: String::new(),
                  texture_bottom: String::new(),
                  r: 120,
                  g: 120,
                  b: 120,
              }
          }

          fn test_scene(blocks: Vec<PreviewBlock>) -> PreviewScene {
              let occupied = blocks
                  .iter()
                  .map(|block| [block.x, block.y, block.z])
                  .collect::<HashSet<_>>();
              PreviewScene {
                  blocks,
                  by_id: HashMap::new(),
                  by_position: HashMap::new(),
                  occupied,
                  texture_cache: Mutex::new(HashMap::new()),
              }
          }

          #[test]
          fn preview_surface_detection_excludes_buried_blocks() {
              let mut blocks = Vec::new();
              for x in 0..3 {
                  for y in 0..3 {
                      for z in 0..3 {
                          blocks.push(test_block(x, y, z));
                      }
                  }
              }
              let scene = test_scene(blocks);
              let center = scene.blocks.iter().find(|block| (block.x, block.y, block.z) == (1, 1, 1)).unwrap();
              let corner = scene.blocks.iter().find(|block| (block.x, block.y, block.z) == (0, 0, 0)).unwrap();
              assert!(!is_surface_block(center, &scene.occupied));
              assert!(is_surface_block(corner, &scene.occupied));
          }

          #[test]
          fn constrained_preview_budget_spends_slots_on_surface_blocks() {
              let mut blocks = Vec::new();
              for x in 0..4 {
                  for y in 0..4 {
                      for z in 0..4 {
                          blocks.push(test_block(x, y, z));
                      }
                  }
              }
              let scene = test_scene(blocks);
              let selected = select_render_blocks(&scene, 10);
              assert_eq!(selected.len(), 10);
              assert!(selected.iter().all(|block| is_surface_block(block, &scene.occupied)));
          }

          #[test]
              fn shading_clamps() {
          '''
          replace_once(anchor, tests, 'preview topology tests')

          path.write_text(text, encoding='utf-8')
          PY

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Format and verify deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path desktop/Cargo.toml --all
          git diff --check
          ! grep -q 'raycast_occupied:' desktop/src/preview.rs
          ! grep -q 'rendered_occupied' desktop/src/preview.rs
          grep -q 'select_render_blocks(&scene, MAX_PREVIEW_BLOCKS)' desktop/src/preview.rs
          grep -q '&self.scene.occupied' desktop/src/preview.rs

      - name: Publish tested preview fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Kate
          git config user.email dhwanksh2000@gmail.com
          git add desktop/src/preview.rs
          git diff --cached --check
          git commit -m 'FIX | BUG-094 Preserve full preview topology'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git push origin --delete __temp_should_not_exist__ || true
