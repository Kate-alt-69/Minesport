name: One Shot Cache Coordination

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-cache-coordination.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minesport-cache-coordination
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Patch cache and publication coordination
        shell: pwsh
        run: python .github/cache_coordination_patch.py

      - name: Remove one-shot integration files
        shell: pwsh
        run: |
          Remove-Item -Force .github/cache_coordination_patch.py
          Remove-Item -Force .github/workflows/one-shot-cache-coordination.yml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Format and validate patch
        shell: pwsh
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --all
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          if (-not (Select-String -Quiet -Path desktop/src/engine_update.rs -SimpleMatch 'runtime::data_root().join("engine-update").join("staged")')) { throw 'durable engine staging root missing' }
          if (Select-String -Quiet -Path desktop/src/engine_update.rs -SimpleMatch 'runtime::cache_root().join("engine-update")') { throw 'engine staging still uses generated cache' }
          if (-not (Select-String -Quiet -Path desktop/src/runtime.rs -SimpleMatch 'Minesport generated cache is currently in use by another process')) { throw 'cross-process generated-cache cleanup guard missing' }
          if (-not (Select-String -Quiet -Path desktop/src/runtime.rs -SimpleMatch '"runtime-assets"')) { throw 'runtime asset publication lease missing' }
          if (-not (Select-String -Quiet -Path desktop/src/bridge_cli.rs -SimpleMatch '"bridge-build"')) { throw 'Bridge build transaction lease missing' }

      - name: Test Windows cache coordination and all Rust targets
        shell: pwsh
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          cargo test --locked --manifest-path desktop/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Windows all-target tests failed' }
          cargo check --locked --release --manifest-path desktop/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Windows release check failed' }

      - name: Commit tested fixes with collision-free IDs
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git stash push -u -m cache-coordination-tested
          git pull --rebase origin main
          git stash pop
          if ($LASTEXITCODE -ne 0) { throw 'tested patch no longer rebases cleanly on current main' }

          $subjects = git log origin/main --format=%s
          $ids = [regex]::Matches(($subjects -join "`n"), 'BUG-(\d+)') | ForEach-Object { [int]$_.Groups[1].Value }
          $max = if ($ids) { ($ids | Measure-Object -Maximum).Maximum } else { 0 }
          $first = $max + 1
          $second = $max + 2

          git add desktop/src/engine_update.rs
          git diff --cached --check
          git commit -m "FIX | BUG-$first Keep staged engine updates durable"

          git add desktop/src/runtime.rs desktop/src/bridge_cli.rs .github/cache_coordination_patch.py .github/workflows/one-shot-cache-coordination.yml
          git diff --cached --check
          git commit -m "FIX | BUG-$second Serialize generated cache publication"

          git push origin HEAD:main
