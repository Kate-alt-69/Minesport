name: One Shot Quilt Direct Launch

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: one-shot-quilt-direct-launch
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.head_commit.message == 'CHORE | stage Quilt direct launch gate'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prove Quilt Loom launch manifest contract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-quilt-launch
          mkdir -p .ci-quilt-launch/gradle/wrapper
          cp minesport-bridge-quilt/gradlew .ci-quilt-launch/gradlew
          cp minesport-bridge-quilt/gradlew.bat .ci-quilt-launch/gradlew.bat
          cp minesport-bridge-quilt/gradle/wrapper/gradle-wrapper.jar .ci-quilt-launch/gradle/wrapper/gradle-wrapper.jar
          cp minesport-bridge-quilt/gradle/wrapper/gradle-wrapper.properties .ci-quilt-launch/gradle/wrapper/gradle-wrapper.properties
          chmod +x .ci-quilt-launch/gradlew

          cat > .ci-quilt-launch/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url 'https://maven.quiltmc.org/repository/release' }
                  maven { url 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'minesport-quilt-launch-proof'
          EOF

          cat > .ci-quilt-launch/gradle.properties <<'EOF'
          minecraft_version=1.21.10
          quilt_loader_version=0.30.1-beta.3
          fabric_version=0.138.4+1.21.10
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.vfs.watch=false
          EOF

          cat > .ci-quilt-launch/build.gradle <<'EOF'
          import groovy.json.JsonOutput

          plugins {
              id 'org.quiltmc.loom' version '1.11.1'
              id 'java'
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }

          repositories {
              maven { url 'https://maven.quiltmc.org/repository/release' }
              maven { url 'https://maven.fabricmc.net/' }
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings loom.officialMojangMappings()
              modImplementation "org.quiltmc:quilt-loader:${project.quilt_loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          tasks.register('minesportResolveRuntime') {
              dependsOn {
                  def runTask = tasks.named('runClient').get()
                  runTask.taskDependencies.getDependencies(runTask)
              }
              doLast {
                  def runTask = tasks.named('runClient').get()
                  def inherited = System.getenv()
                  def environmentOverrides = runTask.environment
                      .findAll { key, value -> inherited[key] != value?.toString() }
                      .collectEntries { key, value -> [(key.toString()): value?.toString()] }
                  def payload = [
                      schema: 1,
                      mainClass: runTask.mainClass.get(),
                      classpath: runTask.classpath.files.collect { it.absolutePath },
                      jvmArgs: runTask.allJvmArgs.collect { it.toString() },
                      args: (runTask.args ?: []).collect { it.toString() },
                      workingDir: runTask.workingDir.absolutePath,
                      environmentOverrides: environmentOverrides,
                  ]
                  file('minesport-launch.json').text = JsonOutput.toJson(payload)
              }
          }
          EOF

          (
            cd .ci-quilt-launch
            timeout 12m ./gradlew --no-daemon --console=plain --max-workers=1 --no-watch-fs minesportResolveRuntime
          )

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.ci-quilt-launch/minesport-launch.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data.get('schema') == 1, data
          assert isinstance(data.get('mainClass'), str) and data['mainClass'].strip(), data
          assert isinstance(data.get('classpath'), list) and data['classpath'], data
          assert isinstance(data.get('jvmArgs'), list), data
          assert isinstance(data.get('args'), list), data
          assert isinstance(data.get('workingDir'), str) and data['workingDir'].strip(), data
          assert isinstance(data.get('environmentOverrides'), dict), data
          missing_jars = [entry for entry in data['classpath'] if entry.endswith('.jar') and not Path(entry).is_file()]
          assert not missing_jars, missing_jars[:10]
          print('Quilt launch manifest contract OK:', data['mainClass'], len(data['classpath']), 'classpath entries')
          PY
          rm -rf .ci-quilt-launch

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Install desktop test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev libudev-dev \
            libgl1-mesa-dev libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev xvfb

      - name: Restore embedded engine artifact
        uses: actions/download-artifact@v7
        with:
          name: minesport-engine-ci
          path: engine/build/libs
          run-id: 33797953559
          github-token: ${{ github.token }}

      - name: Restore embedded 1.21.10 loader bridges
        uses: actions/download-artifact@v7
        with:
          name: loader-bridges-1.21.10
          path: dist/bundled-export-worker
          run-id: 33797953559
          github-token: ${{ github.token }}

      - name: Apply Quilt direct-launch optimization
        shell: bash
        run: |
          set -euo pipefail
          python .github/patches/apply-quilt-direct-launch.py
          cargo fmt --manifest-path desktop/Cargo.toml
          grep -Fq 'runtime_worker_inputs_fingerprint(family, mods_path)?' desktop/src/runtime_worker.rs
          grep -Fq 'RegistryScope::Namespaces' desktop/src/runtime_worker.rs
          grep -Fq 'materialize_bundled_quilt_bridge()?' desktop/src/runtime_worker.rs
          grep -Fq 'BridgeFamily::Quilt, MC_1_21_10' desktop/src/runtime_worker.rs
          git diff --check

      - name: Test Quilt direct launch
        shell: bash
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          set -euo pipefail
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml --all-targets
          cargo check --locked --release --manifest-path desktop/Cargo.toml --all-targets

      - name: Publish rebased tested fix
        shell: bash
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git diff -- desktop/src/runtime_worker.rs > /tmp/quilt-direct-launch.patch
          test -s /tmp/quilt-direct-launch.patch
          git checkout -- desktop/src/runtime_worker.rs
          git pull --rebase origin main
          git apply --3way /tmp/quilt-direct-launch.patch
          cargo fmt --manifest-path desktop/Cargo.toml

          grep -Fq "id 'org.quiltmc.loom' version '1.11.1'" minesport-bridge-quilt/build.gradle
          grep -Fq 'quilt_loader_version=0.30.1-beta.3' minesport-bridge-quilt/gradle.properties
          grep -Fq 'fabric_version=0.138.4+1.21.10' minesport-bridge-quilt/gradle.properties
          grep -Fq 'runtime_worker_inputs_fingerprint(family, mods_path)?' desktop/src/runtime_worker.rs
          grep -Fq 'RegistryScope::Namespaces' desktop/src/runtime_worker.rs
          grep -Fq 'materialize_bundled_quilt_bridge()?' desktop/src/runtime_worker.rs
          git diff --check

          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml --all-targets
          cargo check --locked --release --manifest-path desktop/Cargo.toml --all-targets

          rm -f .github/workflows/one-shot-quilt-direct-launch.yml
          rm -f .github/patches/apply-quilt-direct-launch.py

          subjects="$(git log origin/main --format=%s)"
          max="$(printf '%s\n' "$subjects" | grep -oE 'BUG-[0-9]+' | cut -d- -f2 | sort -n | tail -1)"
          next=$(( ${max:-0} + 1 ))

          git add desktop/src/runtime_worker.rs \
            .github/workflows/one-shot-quilt-direct-launch.yml \
            .github/patches/apply-quilt-direct-launch.py
          git commit -m "FIX | BUG-${next} Bypass Quilt Gradle launch hot path"
          git push origin HEAD:main
