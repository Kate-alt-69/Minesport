      - name: Format Rust
        run: cargo fmt --manifest-path desktop/Cargo.toml --all

      - name: Commit optimization and remove one-shot files
        shell: bash
        run: |
          rm -f .optimize-runtime-fastpath-trigger
          rm -f .github/workflows/optimize-runtime-fastpath.yml
          git config user.name 'Minesport migration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add desktop/src/runtime_worker.rs .optimize-runtime-fastpath-trigger .github/workflows/optimize-runtime-fastpath.yml
          git commit -m 'Use embedded loader Bridges in 1.21.10 runtime workers'
