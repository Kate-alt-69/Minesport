name: Optimize Runtime Fast Path

on:
  push:
    paths:
      - '.optimize-runtime-fastpath-trigger'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply loader-neutral 1.21.10 runtime fast path
        shell: python
        run: |
          from pathlib import Path

          path = Path('desktop/src/runtime_worker.rs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          old = '''    let fast_bundled_fabric = family == BridgeFamily::Fabric && version == MC_1_21_10;
    let java = if fast_bundled_fabric {
        create_fast_bundled_workspace(&workspace, version)?;
        21
    } else {
        let prepared = bridge_family::prepare_source(family, version, &workspace, &mut progress)?;
        if family == BridgeFamily::Fabric {
            bridge_java::tooling_java(
                prepared.java,
                prepared.variables.get("loom_version").map(String::as_str),
            )
        } else {
            prepared.java
        }
    };
'''
          new = '''    let fast_bundled = version == MC_1_21_10;
    let java = if fast_bundled && family == BridgeFamily::Fabric {
        create_fast_bundled_workspace(&workspace, version)?;
        21
    } else {
        let prepared = bridge_family::prepare_source(family, version, &workspace, &mut progress)?;
        let java = if family == BridgeFamily::Fabric {
            bridge_java::tooling_java(
                prepared.java,
                prepared.variables.get("loom_version").map(String::as_str),
            )
        } else {
