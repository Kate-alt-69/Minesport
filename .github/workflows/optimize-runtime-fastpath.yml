          marker = '''fn start_gradle_worker(
'''
          helper = r'''fn tune_runtime_gradle_properties(workspace: &Path) -> Result<()> {
    let path = workspace.join("gradle.properties");
    let existing = fs::read_to_string(&path).unwrap_or_default();
    let tuned = low_resource_gradle_properties(&existing);
    write_file(&path, tuned.as_bytes())
}

fn low_resource_gradle_properties(existing: &str) -> String {
    const MANAGED: &[&str] = &[
        "org.gradle.jvmargs",
        "org.gradle.daemon",
        "org.gradle.parallel",
        "org.gradle.workers.max",
        "org.gradle.vfs.watch",
    ];
    let mut output = String::new();
    for line in existing.lines() {
        let trimmed = line.trim_start();
        let managed = MANAGED.iter().any(|key| {
            trimmed.strip_prefix(key).is_some_and(|rest| rest.trim_start().starts_with('='))
        });
        if managed {
            continue;
        }
        output.push_str(line);
        output.push('\n');
    }
    output.push_str("org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ActiveProcessorCount=2\n");
    output.push_str("org.gradle.daemon=false\n");
    output.push_str("org.gradle.parallel=false\n");
    output.push_str("org.gradle.workers.max=1\n");
    output.push_str("org.gradle.vfs.watch=false\n");
    output
}

