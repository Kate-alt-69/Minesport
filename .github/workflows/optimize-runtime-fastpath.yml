        };

        if fast_bundled {
            let source_root = workspace.join("src");
            if source_root.is_dir() {
                fs::remove_dir_all(&source_root)
                    .with_context(|| format!("remove runtime Bridge source {}", source_root.display()))?;
            }
            let runtime_build = match family {
                BridgeFamily::Forge => FORGE_RUNTIME_BUILD_GRADLE,
                BridgeFamily::NeoForge => NEOFORGE_RUNTIME_BUILD_GRADLE,
                BridgeFamily::Quilt => QUILT_RUNTIME_BUILD_GRADLE,
                BridgeFamily::Fabric => unreachable!("Fabric uses its dedicated bundled workspace"),
            };
            write_file(&workspace.join("build.gradle"), runtime_build.as_bytes())?;
        }
        java
    };
    tune_runtime_gradle_properties(&workspace)?;
