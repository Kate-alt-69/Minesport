name: One Shot Minesport 0.2.1 World Cache

on:
  push:
    branches: [main]
    paths:
      - '.github/world_cache_021_patch.py'
      - '.github/workflows/one-shot-world-cache-021.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
      - name: Apply 0.2.1 world cache patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/world_cache_021_patch.py')
          text = p.read_text(encoding='utf-8')
          old = """    if count != 1:\n        raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')\n    target.write_text(text.replace(old, new, 1), encoding='utf-8')"""
          new = """    if count == 0:\n        raise SystemExit(f'{path}: expected a match, found 0: {old[:100]!r}')\n    if count > 1 and not (path == 'desktop/src/app.rs' and old.strip() == 'add_bubble_fields(&ui, &mut request);'):\n        raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')\n    target.write_text(text.replace(old, new, 1), encoding='utf-8')"""
          if old not in text:
              raise SystemExit('replace_once helper shape changed')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/world_cache_021_patch.py
          git checkout HEAD -- desktop/Cargo.lock
          python3 - <<'PY'
          from pathlib import Path
          p = Path('desktop/Cargo.lock')
          text = p.read_text(encoding='utf-8')
          old = 'name = "minesport-desktop"\nversion = "0.2.0"'
          new = 'name = "minesport-desktop"\nversion = "0.2.1"'
          if text.count(old) != 1:
              raise SystemExit(f'Cargo.lock Minesport package match count: {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Test Java engine
        working-directory: engine
        run: bash ./gradlew --no-daemon test
      - name: Install Slint build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - name: Check Rust world cache and desktop
        working-directory: desktop
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          cargo check --locked
          cargo test --locked
      - name: Validate patch
        run: |
          git diff --check
          test -f desktop/src/world_cache.rs
          test -f engine/src/main/java/dev/kastrick/minesport/cache/ChunkCacheMaterializer.java
          grep -q 'version = "0.2.1"' desktop/Cargo.toml
          grep -q 'const VERSION: &str = "0.2.1"' desktop/src/app.rs
          grep -q 'worldCachePath' desktop/src/app.rs
          grep -q 'ChunkCacheMaterializer' engine/src/main/java/dev/kastrick/minesport/IpcMode.java
          grep -q 'kastrick.*software' desktop/src/world_cache.rs
      - name: Publish tested 0.2.1 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- .github/world_cache_021_patch.py
          git rm .github/world_cache_021_patch.py .github/workflows/one-shot-world-cache-021.yml
          git add -A
          git commit -m 'Start 0.2.1 world chunk cache'
          git push origin HEAD:main
