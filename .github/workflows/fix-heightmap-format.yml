name: Fix Heightmap Format

on:
  push:
    paths:
      - '.fix-heightmap-format-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix one broken Rust format call
        shell: python
        run: |
          from pathlib import Path

          path = Path('desktop/src/app.rs')
          text = path.read_text(encoding='utf-8')
          old = 'diagnostics::append(&format!("Heightmap cache lookup failed for {}: {error:#}"));'
          new = 'diagnostics::append(&format!("Heightmap cache lookup failed for {}: {error:#}", path.display()));'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one broken format call, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit source fix and remove one-shot files
        shell: bash
        run: |
          rm -f .fix-heightmap-format-trigger
          rm -f .github/workflows/fix-heightmap-format.yml
          git config user.name 'Minesport migration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add desktop/src/app.rs .fix-heightmap-format-trigger .github/workflows/fix-heightmap-format.yml
          git commit -m 'Fix heightmap cache diagnostic format'
          git push origin HEAD:main
