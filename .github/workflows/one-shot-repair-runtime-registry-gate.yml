name: One Shot Repair Runtime Registry Gate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'CHORE | repair runtime registry followup gate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove stale fingerprint re-export and retrigger gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/one-shot-runtime-registry-followups.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          new = '''pub use legacy::{
              CaptureNotice, EPHEMERAL_ADDRESS, SNAPSHOT_SCHEMA, mods_fingerprint,
              mods_fingerprint_filtered, snapshot_exists, snapshot_path,
          };'''\n'''
          new = '''          new = '''pub use legacy::{
              CaptureNotice, EPHEMERAL_ADDRESS, SNAPSHOT_SCHEMA, mods_fingerprint_filtered,
              snapshot_exists, snapshot_path,
          };'''\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale re-export patch, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-repair-runtime-registry-gate.yml
          git add .github/workflows/one-shot-runtime-registry-followups.yml
          git commit -m 'CHORE | stage runtime registry followups'
          git push origin HEAD:main
