name: One-shot direct launch optimizer retry

on:
  push:
    paths:
      - '.github/workflows/one-shot-direct-launch-retry.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - name: Install Linux Slint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Apply cached direct-launch patch
        shell: python
        run: |
          import base64
          import re
          import subprocess
          from pathlib import Path

          workflow = Path('.github/workflows/one-shot-direct-launch.yml').read_text(encoding='utf-8')
          match = re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > /tmp/minesport-direct-launch\.py", workflow)
          if not match:
              raise SystemExit('could not recover direct-launch patch payload')
          patch = Path('/tmp/minesport-direct-launch.py')
          patch.write_bytes(base64.b64decode(match.group(1)))
          subprocess.run(['python', str(patch)], check=True)

      - name: Format Rust
        run: cargo fmt --manifest-path desktop/Cargo.toml --all

      - name: Run focused Rust tests
        run: cargo test --manifest-path desktop/Cargo.toml runtime_worker::tests

      - name: Commit optimized runtime launch
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-direct-launch.yml
          rm -f .github/workflows/one-shot-direct-launch-retry.yml
          git config user.name 'Minesport optimization bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- desktop/src/runtime_worker.rs .github/workflows/one-shot-direct-launch.yml .github/workflows/one-shot-direct-launch-retry.yml
          git commit -m 'Cache Fabric launch profile and bypass Gradle'
          git push origin HEAD:main
