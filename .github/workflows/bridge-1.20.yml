name: Minesport Bridge 1.20 Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'bridge-versions/**'
      - 'desktop/src/bridge_compat.rs'
      - 'desktop/src/toolchain.rs'
      - 'desktop/src/bin/bridge-prepare.rs'
      - 'desktop/build.rs'
      - 'desktop/Cargo.toml'
      - '.github/workflows/bridge-1.20.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'bridge-versions/**'
      - 'desktop/src/bridge_compat.rs'
      - 'desktop/src/toolchain.rs'
      - 'desktop/src/bin/bridge-prepare.rs'
      - 'desktop/build.rs'
      - 'desktop/Cargo.toml'
      - '.github/workflows/bridge-1.20.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minesport-bridge-120-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-1-20:
    name: Rust recipe · Minecraft ${{ matrix.minecraft }} · Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { minecraft: '1.20', java: '17' }
          - { minecraft: '1.20.1', java: '17' }
          - { minecraft: '1.20.2', java: '17' }
          - { minecraft: '1.20.3', java: '17' }
          - { minecraft: '1.20.4', java: '17' }
          - { minecraft: '1.20.5', java: '21' }
          - { minecraft: '1.20.6', java: '21' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate and compile from canonical Bridge with Rust
        env:
          MINESPORT_HEADLESS_BRIDGE_PREPARE: '1'
        run: |
          cargo run --manifest-path desktop/Cargo.toml --bin bridge-prepare -- \
            --version '${{ matrix.minecraft }}' \
            --output dist/recipe-bridges
          test -s "dist/recipe-bridges/minesport-bridge-${{ matrix.minecraft }}.jar"
      - uses: actions/upload-artifact@v7
        with:
          name: minesport-bridge-${{ matrix.minecraft }}
          path: dist/recipe-bridges/*.jar
          if-no-files-found: error
          retention-days: 7

  bridge-1-20-clean:
    name: Minecraft 1.20 Rust recipe family compiles
    if: always()
    needs: bridge-1-20
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete matrix
        env:
          RESULT: ${{ needs.bridge-1-20.result }}
        run: |
          echo "1.20 Rust Bridge matrix result: $RESULT"
          test "$RESULT" = success
