name: Minesport Bridge 1.20 Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'bridge-versions/**'
      - 'wrapper/bridgecompat/**'
      - 'wrapper/cmd/bridge-prepare/**'
      - '.github/workflows/bridge-1.20.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'bridge-versions/**'
      - 'wrapper/bridgecompat/**'
      - 'wrapper/cmd/bridge-prepare/**'
      - '.github/workflows/bridge-1.20.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minesport-bridge-120-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-1-20:
    name: Bridge · Minecraft ${{ matrix.minecraft }} · Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { minecraft: '1.20', java: '17' }
          - { minecraft: '1.20.1', java: '17' }
          - { minecraft: '1.20.2', java: '17' }
          - { minecraft: '1.20.3', java: '17' }
          - { minecraft: '1.20.4', java: '17' }
          - { minecraft: '1.20.5', java: '21' }
          - { minecraft: '1.20.6', java: '21' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate and compile from canonical 1.21.10 bridge source
        working-directory: wrapper
        env:
          MINESPORT_BRIDGE_REPO_ROOT: ${{ github.workspace }}
          MINESPORT_BRIDGE_DATA: ${{ runner.temp }}/minesport-bridge-data
        run: |
          go run ./cmd/bridge-prepare \
            -version '${{ matrix.minecraft }}' \
            -output ../dist/recipe-bridges
      - uses: actions/upload-artifact@v7
        with:
          name: minesport-bridge-${{ matrix.minecraft }}
          path: dist/recipe-bridges/*.jar
          if-no-files-found: error
          retention-days: 7

  bridge-1-20-clean:
    name: Minecraft 1.20 bridge family compiles
    if: always()
    needs: bridge-1-20
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete matrix
        env:
          RESULT: ${{ needs.bridge-1-20.result }}
        run: |
          echo "1.20 bridge matrix result: $RESULT"
          test "$RESULT" = success
