name: One Shot FLATTER Geometry Context Fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-flatter-geometry-context-fix.yml"
      - ".github/flatter_geometry_context_fix.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: |
          python3 -m py_compile .github/flatter_geometry_context_fix.py
          python3 .github/flatter_geometry_context_fix.py
          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"

      - name: Test Java engine
        working-directory: engine
        run: bash ./gradlew --no-daemon test

      - name: Commit tested source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engine/src/main/java/dev/kastrick/minesport/GeometryBuilder.java \
            engine/src/main/java/dev/kastrick/minesport/export/FlatterOptimizer.java \
            engine/src/main/java/dev/kastrick/minesport/export/ObjExporter.java \
            engine/src/main/java/dev/kastrick/minesport/export/GltfExporter.java
          git diff --cached --check
          git commit -m "FIX | BUG-057 Reuse authoritative export geometry"
          git push origin HEAD:main
