name: Rust Slint Desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "engine/**"
      - ".github/workflows/desktop-rust.yml"
  workflow_dispatch:

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust 1.92
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - name: Build Java engine for embedding
        shell: pwsh
        run: |
          Push-Location engine
          .\gradlew.bat --no-daemon test jar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Test Rust desktop
        shell: pwsh
        run: cargo test --manifest-path desktop/Cargo.toml

      - name: Build Rust desktop release
        shell: pwsh
        run: cargo build --release --manifest-path desktop/Cargo.toml
