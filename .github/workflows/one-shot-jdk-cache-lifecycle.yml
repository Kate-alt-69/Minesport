name: One Shot JDK Cache Lifecycle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-jdk-cache-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minesport-jdk-cache-lifecycle
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Patch managed-JDK cache lifecycle
        shell: pwsh
        run: python .github/jdk_cache_lifecycle_patch.py

      - name: Remove one-shot integration files
        shell: pwsh
        run: |
          Remove-Item -Force .github/jdk_cache_lifecycle_patch.py
          Remove-Item -Force .github/workflows/one-shot-jdk-cache-lifecycle.yml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Format and validate patch
        shell: pwsh
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --all
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          if (-not (Select-String -Quiet -Path desktop/src/toolchain.rs -SimpleMatch 'coordinate Minesport-managed JDK')) { throw 'per-JDK process lease missing' }
          if (-not (Select-String -Quiet -Path desktop/src/toolchain.rs -SimpleMatch 'acquire_generated_cache_process_lease')) { throw 'toolchain generated-cache process lease missing' }
          if (-not (Select-String -Quiet -Path desktop/src/main.rs -SimpleMatch '_engine_worker_cache_lease')) { throw 'self-worker lifetime cache lease missing' }
          if (-not (Select-String -Quiet -Path desktop/src/bin/minesport-engine.rs -SimpleMatch '_generated_cache_lease')) { throw 'sidecar lifetime cache lease missing' }

      - name: Test Windows JDK and engine cache lifecycle
        shell: pwsh
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          cargo test --locked --manifest-path desktop/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Windows all-target tests failed' }
          cargo check --locked --release --manifest-path desktop/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Windows release check failed' }

      - name: Commit tested fix with collision-free ID
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git stash push -u -m jdk-cache-lifecycle-tested
          git pull --rebase origin main
          git stash pop
          if ($LASTEXITCODE -ne 0) { throw 'tested patch no longer rebases cleanly on current main' }

          $subjects = git log origin/main --format=%s
          $ids = [regex]::Matches(($subjects -join "`n"), 'BUG-(\d+)') | ForEach-Object { [int]$_.Groups[1].Value }
          $max = if ($ids) { ($ids | Measure-Object -Maximum).Maximum } else { 0 }
          $id = $max + 1

          git add desktop/src/runtime.rs desktop/src/toolchain.rs desktop/src/main.rs desktop/src/bin/minesport-engine.rs .github/jdk_cache_lifecycle_patch.py .github/workflows/one-shot-jdk-cache-lifecycle.yml
          git diff --cached --check
          git commit -m "FIX | BUG-$id Protect managed JDK cache lifetime"
          git push origin HEAD:main
