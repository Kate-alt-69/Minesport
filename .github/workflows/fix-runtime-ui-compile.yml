name: Fix Runtime UI Compile

on:
  push:
    paths:
      - '.fix-runtime-ui-compile-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix heightmap diagnostic format
        shell: python
        run: |
          from pathlib import Path

          path = Path('desktop/src/app.rs')
          text = path.read_text(encoding='utf-8')
          old = 'diagnostics::append(&format!("Heightmap cache lookup failed for {}: {error:#}"));'
          new = 'diagnostics::append(&format!("Heightmap cache lookup failed for {}: {error:#}", path.display()));'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one broken format call, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Format Rust
        run: cargo fmt --manifest-path desktop/Cargo.toml --all

      - name: Fast Rust + Slint check
        env:
          MINESPORT_FAST_CHECK: '1'
        run: cargo check --manifest-path desktop/Cargo.toml --all-targets

      - name: Commit fix and remove one-shot files
        shell: bash
        run: |
          rm -f .fix-runtime-ui-compile-trigger
          rm -f .github/workflows/fix-runtime-ui-compile.yml
          git config user.name 'Minesport migration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add desktop/src/app.rs .fix-runtime-ui-compile-trigger .github/workflows/fix-runtime-ui-compile.yml
          git commit -m 'Fix runtime UI compile diagnostic'
          git push origin HEAD:main
