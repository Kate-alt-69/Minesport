name: One Shot Stage Workflow Blobs V9

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-stage-workflow-blobs-v9.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Generate and stage exact workflow blobs
        run: |
          set -euo pipefail
          python .github/workflow_version_v8_patch.py
          grep -q 'MINESPORT_VERSION' .github/workflows/build.yml
          grep -q 'MINESPORT_VERSION' .github/workflows/release-windows.yml
          ! grep -q 'Minesport-0.2.1' .github/workflows/build.yml
          ! grep -q 'Minesport-0.2.1' .github/workflows/release-windows.yml

          mkdir -p .github/generated-workflows-v9
          cp .github/workflows/build.yml .github/generated-workflows-v9/build.yml.txt
          cp .github/workflows/release-windows.yml .github/generated-workflows-v9/release-windows.yml.txt

          # Keep this Actions push free of workflow-file modifications. The
          # connector will reuse these exact content-addressed blobs afterward.
          git restore --source=HEAD -- .github/workflows/build.yml .github/workflows/release-windows.yml

      - name: Publish staged blobs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/generated-workflows-v9/build.yml.txt .github/generated-workflows-v9/release-windows.yml.txt
          git diff --cached --check
          git commit -m "CHORE | stage exact generated workflow blobs"
          git push origin HEAD:main
