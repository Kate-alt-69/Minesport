name: One Shot Updater Bounds

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-updater-bounds.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minesport-updater-bounds
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Patch updater response bounds
        shell: pwsh
        run: python .github/updater_bounds_patch.py

      - name: Remove one-shot integration files
        shell: pwsh
        run: |
          Remove-Item -Force .github/updater_bounds_patch.py
          Remove-Item -Force .github/workflows/one-shot-updater-bounds.yml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Format and validate patch
        shell: pwsh
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --all
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          if (-not (Select-String -Quiet -Path desktop/src/engine_update.rs -SimpleMatch 'response exceeds')) { throw 'explicit release response bound missing' }
          if (-not (Select-String -Quiet -Path installer/windows/minesport.nsi -SimpleMatch 'preserves that')) { throw 'rollback installer comment not updated' }

      - name: Test Windows updater build
        shell: pwsh
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          cargo test --locked --manifest-path desktop/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Windows all-target tests failed' }
          cargo check --locked --release --manifest-path desktop/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Windows release check failed' }

      - name: Commit tested fix with collision-free ID
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git stash push -u -m updater-bounds-tested
          git pull --rebase origin main
          git stash pop
          if ($LASTEXITCODE -ne 0) { throw 'tested patch no longer rebases cleanly on current main' }

          $subjects = git log origin/main --format=%s
          $ids = [regex]::Matches(($subjects -join "`n"), 'BUG-(\d+)') | ForEach-Object { [int]$_.Groups[1].Value }
          $max = if ($ids) { ($ids | Measure-Object -Maximum).Maximum } else { 0 }
          $id = $max + 1

          git add desktop/src/engine_update.rs installer/windows/minesport.nsi .github/updater_bounds_patch.py .github/workflows/one-shot-updater-bounds.yml
          git diff --cached --check
          git commit -m "FIX | BUG-$id Enforce explicit updater response bounds"
          git push origin HEAD:main
