name: One-shot direct launch optimizer

on:
  push:
    paths:
      - '.github/workflows/one-shot-direct-launch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cached direct-launch patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/minesport-direct-launch.py
          python /tmp/minesport-direct-launch.py

      - name: Format Rust
        run: cargo fmt --manifest-path desktop/Cargo.toml --all

      - name: Run focused Rust tests
        run: cargo test --manifest-path desktop/Cargo.toml runtime_worker::tests

      - name: Commit optimized runtime launch
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-direct-launch.yml
          git config user.name 'Minesport optimization bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- desktop/src/runtime_worker.rs .github/workflows/one-shot-direct-launch.yml
          git commit -m 'Cache Fabric launch profile and bypass Gradle'
          git push origin HEAD:main
