name: Minesport Export Workers

on:
  push:
    branches: [main]
    paths:
      - 'minesport-bridge-fabric/**'
      - 'minesport-bridge-fabric-versions/**'
      - 'minesport-bridge-forge/**'
      - 'minesport-bridge-forge-versions/**'
      - 'minesport-bridge-neoforge/**'
      - 'minesport-bridge-neoforge-versions/**'
      - 'minesport-bridge-quilt/**'
      - 'minesport-bridge-quilt-versions/**'
      - 'desktop/src/bin/bridge-prepare.rs'
      - 'desktop/src/bridge_compat.rs'
      - 'desktop/src/bridge_family.rs'
      - 'desktop/src/bridge_build.rs'
      - 'desktop/src/bridge_java.rs'
      - 'desktop/src/toolchain.rs'
      - 'desktop/build.rs'
      - '.github/workflows/export-worker-loaders.yml'
  workflow_dispatch:

jobs:
  canonical-1-21-10:
    name: ${{ matrix.name }} Export Worker · Minecraft 1.21.10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fabric
            slug: fabric
            project: minesport-bridge-fabric
          - name: Forge
            slug: forge
            project: minesport-bridge-forge
          - name: NeoForge
            slug: neoforge
            project: minesport-bridge-neoforge
          - name: Quilt
            slug: quilt
            project: minesport-bridge-quilt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build canonical Export Worker
        working-directory: ${{ matrix.project }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain build
      - name: Verify Export Worker JAR
        working-directory: ${{ matrix.project }}
        run: |
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print
      - name: Upload Export Worker JAR
        uses: actions/upload-artifact@v7
        with:
          name: minesport-export-worker-${{ matrix.slug }}-1.21.10
          path: |
            ${{ matrix.project }}/build/libs/*.jar
            !${{ matrix.project }}/build/libs/*-sources.jar
            !${{ matrix.project }}/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14

  compatibility-floor-1-21-5:
    name: ${{ matrix.name }} Export Worker · PATCH floor 1.21.5
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Fabric
            slug: fabric
          - name: Forge
            slug: forge
          - name: NeoForge
            slug: neoforge
          - name: Quilt
            slug: quilt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Rust/Slint build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - name: Generate and compile 1.21.5 Export Worker with Rust patcher
        env:
          MINESPORT_HEADLESS_BRIDGE_PREPARE: '1'
        run: |
          cargo run --manifest-path desktop/Cargo.toml --bin bridge-prepare -- \
            --loader '${{ matrix.slug }}' \
            --version '1.21.5' \
            --output dist/loader-floor
          test -s 'dist/loader-floor/minesport-bridge-${{ matrix.slug }}-1.21.5.jar'
      - name: Upload 1.21.5 Export Worker
        uses: actions/upload-artifact@v7
        with:
          name: minesport-export-worker-${{ matrix.slug }}-1.21.5
          path: dist/loader-floor/minesport-bridge-${{ matrix.slug }}-1.21.5.jar
          if-no-files-found: error
          retention-days: 14
