name: One Shot Export Worker Internal Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/export_worker_internal_cleanup.py'
      - '.github/workflows/one-shot-export-worker-internal.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply internal Export Worker cleanup
        run: python3 .github/export_worker_internal_cleanup.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build canonical Export Workers
        run: |
          for project in minesport-bridge-fabric minesport-bridge-forge minesport-bridge-neoforge minesport-bridge-quilt; do
            echo "=== $project ==="
            (cd "$project" && bash ./gradlew --no-daemon clean build)
          done

      - name: Verify canonical worker identities
        run: |
          test -s minesport-bridge-fabric/build/libs/minesport_export_worker-fabric-1.21.10.jar
          test -s minesport-bridge-forge/build/libs/minesport_export_worker-forge-1.21.10.jar
          test -s minesport-bridge-neoforge/build/libs/minesport_export_worker-neoforge-1.21.10.jar
          test -s minesport-bridge-quilt/build/libs/minesport_export_worker-quilt-1.21.10.jar
          test -f minesport-bridge-fabric/src/client/java/dev/kastrick/minesport/bridge/MinesportExportWorker.java
          test -f minesport-bridge-fabric/src/main/java/dev/kastrick/minesport/bridge/model/ExportWorkerProtocol.java
          test -f minesport-bridge-fabric/src/main/java/dev/kastrick/minesport/bridge/socket/ExportWorkerSender.java
          grep -q 'dev.kastrick.minesport.bridge.MinesportExportWorker' minesport-bridge-fabric/src/main/resources/fabric.mod.json
          ! grep -R -E 'MinesportBridge|BridgeProtocol|BridgeSender' minesport-bridge-fabric minesport-bridge-forge minesport-bridge-neoforge minesport-bridge-quilt --include='*.java' --include='*.json' --include='*.toml'

      - name: Install Slint build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev

      - name: Check and test Rust desktop
        working-directory: desktop
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          cargo check --locked --all-targets
          cargo test --locked --all-targets

      - name: Exercise compatibility recipe renames
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          check_source() {
            loader="$1"
            version="$2"
            out="$(cargo run --quiet --locked --manifest-path desktop/Cargo.toml --bin bridge-prepare -- --loader "$loader" --version "$version" --source-only)"
            echo "$loader $version -> $out"
            test -d "$out"
            test -n "$(find "$out" -type f -name 'MinesportExportWorker.java' -print -quit)"
            test -n "$(find "$out" -type f -name 'ExportWorkerProtocol.java' -print -quit)"
            test -n "$(find "$out" -type f -name 'ExportWorkerSender.java' -print -quit)"
            ! find "$out" -type f \( -name 'MinesportBridge.java' -o -name 'BridgeProtocol.java' -o -name 'BridgeSender.java' \) -print -quit | grep -q .
          }
          check_source fabric 1.19.2
          check_source fabric 26.2
          check_source fabric 1.21.5
          check_source forge 1.21.5
          check_source neoforge 1.21.5
          check_source quilt 1.21.5

      - name: Validate cleanup
        run: |
          git diff --check
          grep -q 'minesport-engine-0.2.1.jar' desktop/src/runtime.rs
          grep -q '.minesport_export_worker-fabric-1.21.10.tmp' desktop/src/runtime.rs
          grep -q 'MinesportExportWorker.java' desktop/src/bridge_compat.rs
          grep -q 'MinesportExportWorker.java' desktop/src/bridge_family.rs
          ! grep -R -E 'MinesportBridge|BridgeProtocol|BridgeSender' \
            desktop/src minesport-bridge-fabric minesport-bridge-forge minesport-bridge-neoforge minesport-bridge-quilt \
            minesport-bridge-fabric-versions minesport-bridge-forge-versions minesport-bridge-neoforge-versions minesport-bridge-quilt-versions \
            --include='*.rs' --include='*.java' --include='*.json' --include='*.toml' --include='*.gradle' --include='*.properties'

      - name: Create tested cleanup commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/export_worker_internal_cleanup.py .github/workflows/one-shot-export-worker-internal.yml
          git add -A
          git diff --cached --check
          git commit -m 'Rename Export Worker internals for 0.2.1'
          tested="$(git rev-parse HEAD)"
          echo "TESTED_COMMIT=$tested"
          set +e
          git push origin HEAD:main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "GitHub Actions cannot publish workflow-changing commits; tested object uploaded as $tested"
          fi
          exit 0
