name: One Shot Engine Identity Integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-bug-091-engine-identity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Patch engine identity contracts
        shell: python
        run: |
          from pathlib import Path

          runtime = Path("desktop/src/runtime.rs")
          text = runtime.read_text(encoding="utf-8")
          old = 'const ENGINE_BYTES: &[u8] = include_bytes!(concat!(env!("OUT_DIR"), "/minesport-engine.jar"));\nconst FABRIC_EXPORT_WORKER_BYTES: &[u8] =\n    include_bytes!(concat!(env!("OUT_DIR"), "/minesport_export_worker-fabric.jar"));'
          new = 'const ENGINE_BYTES: &[u8] = include_bytes!(concat!(env!("OUT_DIR"), "/minesport-engine.jar"));\nconst ENGINE_VERSION_RAW: &str = include_str!("../../engine/VERSION");\nconst FABRIC_EXPORT_WORKER_BYTES: &[u8] =\n    include_bytes!(concat!(env!("OUT_DIR"), "/minesport_export_worker-fabric.jar"));'
          if text.count(old) != 1:
              raise SystemExit("runtime.rs engine-byte anchor moved; refusing automatic patch")
          text = text.replace(old, new, 1)

          old = (
              'pub fn materialize_engine() -> Result<PathBuf> {\n'
              '    materialize_runtime_asset(\n'
              '        "minesport-engine-0.2.1.jar",\n'
              '        ".minesport-engine-0.2.1.tmp",\n'
              '        ENGINE_BYTES,\n'
              '    )\n'
              '}\n'
          )
          new = (
              'pub fn materialize_engine() -> Result<PathBuf> {\n'
              '    let version = ENGINE_VERSION_RAW.trim();\n'
              '    if version.is_empty() {\n'
              '        bail!("engine/VERSION must not be empty");\n'
              '    }\n'
              '    if !version.bytes().all(|byte| {\n'
              "        byte.is_ascii_alphanumeric() || matches!(byte, b'.' | b'-' | b'+' | b'_')\n"
              '    }) {\n'
              '        bail!("engine/VERSION contains unsafe cache-name characters");\n'
              '    }\n'
              '    let name = format!("minesport-engine-{version}.jar");\n'
              '    let temporary_name = format!(".minesport-engine-{version}.tmp");\n'
              '    materialize_runtime_asset(&name, &temporary_name, ENGINE_BYTES)\n'
              '}\n'
          )
          if text.count(old) != 1:
              raise SystemExit("runtime.rs materialize_engine anchor moved; refusing automatic patch")
          runtime.write_text(text.replace(old, new, 1), encoding="utf-8")

          app = Path("desktop/src/app.rs")
          text = app.read_text(encoding="utf-8")
          worker_old = '        "workerInfo" => append_diagnostic(&ui, &format!("[backend] {}", response.message)),\n'
          worker_new = (
              '        "workerInfo" => {\n'
              '            let message = response.message.clone();\n'
              '            append_diagnostic(&ui, &format!("[backend] {message}"));\n'
              '            if response.percent > 0 {\n'
              '                ui.set_engine_ready(false);\n'
              '                ui.set_engine_status("ENGINE STARTING".into());\n'
              '                ui.set_task_active(true);\n'
              '                ui.set_task_progress((response.percent.clamp(0, 100) as f32) / 100.0);\n'
              '                ui.set_task_title("ENGINE STARTING".into());\n'
              '                ui.set_task_detail(message.into());\n'
              '            }\n'
              '        }\n'
          )
          if text.count(worker_old) != 1:
              raise SystemExit("app.rs workerInfo anchor moved; refusing automatic patch")
          text = text.replace(worker_old, worker_new, 1)

          ready_old = '            ui.set_engine_status("ENGINE READY".into());\n            ui.set_task_title("READY".into());\n'
          ready_new = (
              '            ui.set_engine_status("ENGINE READY".into());\n'
              '            ui.set_task_completing(false);\n'
              '            ui.set_task_active(false);\n'
              '            ui.set_task_progress(1.0);\n'
              '            ui.set_task_title("READY".into());\n'
          )
          if text.count(ready_old) != 1:
              raise SystemExit("app.rs ENGINE READY anchor moved; refusing automatic patch")
          app.write_text(text.replace(ready_old, ready_new, 1), encoding="utf-8")

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/one-shot-bug-091-engine-identity.yml

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'ENGINE_VERSION_RAW.*engine/VERSION' desktop/src/runtime.rs
          grep -q 'minesport-engine-{version}.jar' desktop/src/runtime.rs
          grep -q 'ui.set_engine_status("ENGINE STARTING"' desktop/src/app.rs
          grep -q 'ui.set_task_progress(1.0)' desktop/src/app.rs

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Format, check, and test Rust desktop
        env:
          MINESPORT_FAST_CHECK: "1"
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml --all-targets
          cargo check --locked --release --manifest-path desktop/Cargo.toml --all-targets

      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIX | BUG-091 Align engine startup and payload identity"
          git pull --rebase origin main
          git push origin HEAD:main
