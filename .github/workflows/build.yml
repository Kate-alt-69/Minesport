name: Minesport Compile Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: minesport-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fabric-bridge-bundled:
    name: Bundled bridge · 1.21.9–1.21.10 · Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Prove 1.21.9 source compatibility
        working-directory: bridge
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean build \
            -Pminecraft_version=1.21.9 \
            -Ploader_version=0.18.5 \
            '-Pfabric_version=0.134.1+1.21.9'
      - name: Build canonical bundled 1.21.10 bridge
        working-directory: bridge
        run: ./gradlew --no-daemon --stacktrace clean build
      - name: Stage canonical bundled bridge
        run: |
          mkdir -p dist/bundled-bridge
          jar="$(find bridge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' -print -quit)"
          test -n "$jar"
          cp "$jar" dist/bundled-bridge/minesport-bridge-0.2.0.jar
          cp "$jar" dist/bundled-bridge/minesport-bridge-0.1.0.jar
      - uses: actions/upload-artifact@v7
        with:
          name: fabric-bridge-1.21.10
          path: dist/bundled-bridge/
          if-no-files-found: error
          retention-days: 7

  bridge-recipe-tests:
    name: Bridge recipe engine · headless Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum
      - name: Test compatibility backend only
        working-directory: wrapper
        env:
          MINESPORT_BRIDGE_REPO_ROOT: ${{ github.workspace }}
        run: go test ./bridgecompat ./bridgecapture ./cacheclean ./ipc ./launcher ./processutil

  fabric-bridge-recipes:
    name: Dynamic bridge · ${{ matrix.minecraft }} · Java ${{ matrix.java }}
    needs: bridge-recipe-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { minecraft: '1.21', java: '21' }
          - { minecraft: '1.21.1', java: '21' }
          - { minecraft: '1.21.2', java: '21' }
          - { minecraft: '1.21.3', java: '21' }
          - { minecraft: '1.21.4', java: '21' }
          - { minecraft: '1.21.5', java: '21' }
          - { minecraft: '1.21.6', java: '21' }
          - { minecraft: '1.21.7', java: '21' }
          - { minecraft: '1.21.8', java: '21' }
          - { minecraft: '1.21.11', java: '21' }
          - { minecraft: '26.1', java: '25' }
          - { minecraft: '26.1.2', java: '25' }
          - { minecraft: '26.2', java: '25' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate and compile compatibility bridge
        working-directory: wrapper
        env:
          MINESPORT_BRIDGE_REPO_ROOT: ${{ github.workspace }}
          MINESPORT_BRIDGE_DATA: ${{ runner.temp }}/minesport-bridge-data
        run: |
          go run ./cmd/bridge-prepare \
            -version '${{ matrix.minecraft }}' \
            -output ../dist/recipe-bridges
      - uses: actions/upload-artifact@v7
        with:
          name: fabric-bridge-recipe-${{ matrix.minecraft }}
          path: dist/recipe-bridges/*.jar
          if-no-files-found: error
          retention-days: 7

  java-engine:
    name: Java engine · Java 22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile and test engine
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean build
      - uses: actions/upload-artifact@v7
        with:
          name: minesport-engine-ci
          path: engine/build/libs/minesport-engine-*.jar
          if-no-files-found: error
          retention-days: 7

  blender-translator:
    name: Blender translator · Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate translator project and syntax
        run: |
          python -c "import pathlib,tomllib; tomllib.loads(pathlib.Path('wrapper/blendertranslator/pyproject.toml').read_text(encoding='utf-8')); print('pyproject.toml OK')"
          python -m compileall -q wrapper/blendertranslator/minesport_translator

  desktop:
    name: Rust + Slint desktop · ${{ matrix.name }}
    needs: java-engine
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Linux amd64', os: ubuntu-latest, binary: minesport }
          - { name: 'Windows amd64', os: windows-latest, binary: minesport.exe }
          - { name: 'macOS', os: macos-latest, binary: minesport }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: minesport-engine-ci
          path: engine/build/libs
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - name: Install Linux Slint dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - name: Test Rust desktop and compile Slint UI
        shell: bash
        run: cargo test --manifest-path desktop/Cargo.toml
      - name: Build Rust desktop release
        shell: bash
        run: cargo build --release --manifest-path desktop/Cargo.toml
      - name: Smoke test headless CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./desktop/target/release/minesport.exe --version
            ./desktop/target/release/minesport.exe --help
            mkdir -p dist/source
            cp desktop/target/release/minesport.exe dist/source/Minesport.exe
          else
            ./desktop/target/release/minesport --version
            ./desktop/target/release/minesport --help
          fi
      - name: Validate Bash packaging scripts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n build.sh
          bash -n installer/linux/build-deb.sh
          bash -n installer/linux/build-appimage.sh
          ./build.sh --help >/dev/null
      - name: Validate PowerShell build scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(
            (Join-Path $env:GITHUB_WORKSPACE 'build.ps1'),
            (Join-Path $env:GITHUB_WORKSPACE 'installer\windows\install-blender.ps1')
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "$file contains syntax errors"
            }
          }
          & (Join-Path $env:GITHUB_WORKSPACE 'build.bat') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'build.bat --help failed.' }
      - uses: actions/upload-artifact@v7
        with:
          name: minesport-desktop-${{ runner.os }}-${{ runner.arch }}
          path: desktop/target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: minesport-windows-standalone
          path: dist/source/Minesport.exe
          if-no-files-found: error
          retention-days: 7

  windows-installer:
    name: Windows installers · Rust/Slint · NSIS EXE + WiX 7 MSI
    needs: [desktop, fabric-bridge-bundled]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v7
        with:
          name: minesport-windows-standalone
          path: dist/source
      - uses: actions/download-artifact@v7
        with:
          name: fabric-bridge-1.21.10
          path: dist/bundled-bridge
      - name: Smoke test Rust desktop artifact
        shell: pwsh
        run: |
          & .\dist\source\Minesport.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Rust desktop --version smoke test failed.' }
      - name: Install and locate NSIS
        shell: pwsh
        run: |
          & choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey could not install NSIS.' }
          $nsisCandidates = @('C:\Program Files (x86)\NSIS\makensis.exe','C:\Program Files\NSIS\makensis.exe')
          $makensis = $nsisCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw 'NSIS makensis.exe was not found after installation.' }
          "NSIS_EXE=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'dist\installer') | Out-Null
      - name: Build MSI with WiX 7
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'installer\windows\Minesport.wixproj'
          $output = Join-Path $env:GITHUB_WORKSPACE 'dist\installer'
          & dotnet build $project --configuration Release --output $output --no-incremental "-p:SourceDir=$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw 'WiX 7 MSI build failed.' }
      - name: Build NSIS setup EXE
        shell: pwsh
        run: |
          & $env:NSIS_EXE '/V2' "/DSourceDir=$env:GITHUB_WORKSPACE" (Join-Path $env:GITHUB_WORKSPACE 'installer\windows\minesport.nsi')
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compilation failed.' }
      - name: Verify Windows installer outputs
        shell: pwsh
        run: |
          $msi = Join-Path $env:GITHUB_WORKSPACE 'dist\installer\Minesport-0.2.0-x64.msi'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\installer\Minesport-0.2.0-Setup-x64.exe'
          $standalone = Join-Path $env:GITHUB_WORKSPACE 'dist\source\Minesport.exe'
          if (-not (Test-Path $msi)) { throw "Missing MSI: $msi" }
          if (-not (Test-Path $exe)) { throw "Missing setup EXE: $exe" }
          if (-not (Test-Path $standalone)) { throw "Missing standalone executable: $standalone" }
          if ((Get-Item $msi).Length -le 0 -or (Get-Item $exe).Length -le 0) { throw 'An installer output is empty.' }
      - uses: actions/upload-artifact@v7
        with:
          name: minesport-windows-installers
          path: |
            dist/installer/Minesport-0.2.0-x64.msi
            dist/installer/Minesport-0.2.0-Setup-x64.exe
            dist/source/Minesport.exe
          if-no-files-found: error
          retention-days: 7

  linux-installer:
    name: Linux packages · Rust/Slint · DEB + AppImage
    needs: [desktop, fabric-bridge-bundled]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: minesport-desktop-Linux-X64
          path: desktop/dist
      - uses: actions/download-artifact@v7
        with:
          name: fabric-bridge-1.21.10
          path: dist/bundled-bridge
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev curl file
      - name: Build Linux packages
        run: |
          chmod +x desktop/dist/minesport installer/linux/build-deb.sh installer/linux/build-appimage.sh
          installer/linux/build-deb.sh
          installer/linux/build-appimage.sh
      - name: Inspect and smoke test DEB
        run: |
          deb="$(find dist/installer -maxdepth 1 -type f -name 'Minesport-*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb" >/dev/null
          root="$RUNNER_TEMP/minesport-deb-root"
          rm -rf "$root"
          mkdir -p "$root"
          dpkg-deb -x "$deb" "$root"
          "$root/usr/lib/kastrick_software/minesport/minesport" --version
      - name: Inspect and smoke test AppImage
        run: |
          appimage="$(find dist/installer -maxdepth 1 -type f -name 'Minesport-*.AppImage' -print -quit)"
          test -n "$appimage"
          test -x "$appimage"
          file "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
          ls -lh dist/installer
      - uses: actions/upload-artifact@v7
        with:
          name: minesport-linux-installers
          path: |
            dist/installer/Minesport-*.deb
            dist/installer/Minesport-*.AppImage
          if-no-files-found: error
          retention-days: 7

  compile-clean:
    name: Compile cleanly
    if: always()
    needs:
      - fabric-bridge-bundled
      - bridge-recipe-tests
      - fabric-bridge-recipes
      - java-engine
      - blender-translator
      - desktop
      - windows-installer
      - linux-installer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUNDLED_BRIDGE_RESULT: ${{ needs.fabric-bridge-bundled.result }}
      RECIPE_TEST_RESULT: ${{ needs.bridge-recipe-tests.result }}
      RECIPE_BRIDGE_RESULT: ${{ needs.fabric-bridge-recipes.result }}
      ENGINE_RESULT: ${{ needs.java-engine.result }}
      TRANSLATOR_RESULT: ${{ needs.blender-translator.result }}
      DESKTOP_RESULT: ${{ needs.desktop.result }}
      WIN_INSTALLER_RESULT: ${{ needs.windows-installer.result }}
      LINUX_INSTALLER_RESULT: ${{ needs.linux-installer.result }}
    steps:
      - name: Report compile status
        id: verdict
        continue-on-error: true
        run: |
          {
            echo "## Minesport compile report"
            echo
            echo "| Component | Result |"
            echo "|---|---|"
            echo "| Bundled bridge · 1.21.9–1.21.10 | $BUNDLED_BRIDGE_RESULT |"
            echo "| Compatibility backend tests | $RECIPE_TEST_RESULT |"
            echo "| Dynamic bridge matrix | $RECIPE_BRIDGE_RESULT |"
            echo "| Java engine | $ENGINE_RESULT |"
            echo "| Blender translator | $TRANSLATOR_RESULT |"
            echo "| Rust + Slint desktop | $DESKTOP_RESULT |"
            echo "| Windows installers | $WIN_INSTALLER_RESULT |"
            echo "| Linux packages | $LINUX_INSTALLER_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$BUNDLED_BRIDGE_RESULT" = success ] && \
             [ "$RECIPE_TEST_RESULT" = success ] && \
             [ "$RECIPE_BRIDGE_RESULT" = success ] && \
             [ "$ENGINE_RESULT" = success ] && \
             [ "$TRANSLATOR_RESULT" = success ] && \
             [ "$DESKTOP_RESULT" = success ] && \
             [ "$WIN_INSTALLER_RESULT" = success ] && \
             [ "$LINUX_INSTALLER_RESULT" = success ]; then
            echo 'result=success' >> "$GITHUB_OUTPUT"
            echo '✅ Supported Minesport 0.2.0 components compiled, tested, and packaged cleanly.' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'result=failure' >> "$GITHUB_OUTPUT"
            echo '❌ One or more required compile/package jobs failed.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Publish connector-visible CI status
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.verdict.outputs.result }}
        run: |
          state="$VERDICT"
          if [ "$state" != success ]; then state=failure; fi
          description='Supported Rust/Slint Minesport builds and packages passed'
          if [ "$state" != success ]; then description='One or more required CI jobs failed'; fi
          payload="$(printf '{\"state\":\"%s\",\"context\":\"Minesport/full-ci\",\"description\":\"%s\",\"target_url\":\"https://github.com/%s/actions/runs/%s\"}' "$state" "$description" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
      - name: Enforce final verdict
        if: always()
        env:
          VERDICT: ${{ steps.verdict.outputs.result }}
        run: test "$VERDICT" = success
