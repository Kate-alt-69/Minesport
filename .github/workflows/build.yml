name: Minesport Compile Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minesport-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fabric-bridge-bundled:
    name: Bundled bridge · 1.21.9–1.21.10 · Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prove 1.21.9 compatibility from the shared source
        working-directory: bridge
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean build \
            -Pminecraft_version=1.21.9 \
            -Ploader_version=0.18.5 \
            '-Pfabric_version=0.134.1+1.21.9'

      - name: Build the bundled 1.21.10 bridge
        working-directory: bridge
        run: ./gradlew --no-daemon --stacktrace clean build

      - name: Stage bundled bridge
        shell: bash
        run: |
          mkdir -p dist/bundled-bridge
          jar="$(find bridge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          if [ -z "$jar" ]; then
            echo 'ERROR: remapped 1.21.10 bridge JAR was not produced' >&2
            exit 1
          fi
          cp "$jar" dist/bundled-bridge/minesport-bridge-0.1.0.jar

      - name: Upload bundled bridge
        uses: actions/upload-artifact@v7
        with:
          name: fabric-bridge-1.21.10
          path: dist/bundled-bridge/minesport-bridge-0.1.0.jar
          if-no-files-found: error
          retention-days: 7

  fabric-bridge-recipes:
    name: Dynamic recipe · ${{ matrix.minecraft }} · Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21.11'
            java: '21'
          - minecraft: '26.2'
            java: '25'
          - minecraft: '26.3-snapshot-7'
            java: '25'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare and compile from 1.21.10 source + JSON recipe
        working-directory: wrapper
        env:
          MINESPORT_BRIDGE_REPO_ROOT: ${{ github.workspace }}
          MINESPORT_BRIDGE_DATA: ${{ runner.temp }}/minesport-bridge-data
        run: |
          go run ./cmd/bridge-prepare \
            -version '${{ matrix.minecraft }}' \
            -output ../dist/recipe-bridges

      - name: Upload recipe-built bridge
        uses: actions/upload-artifact@v7
        with:
          name: fabric-bridge-recipe-${{ matrix.minecraft }}
          path: dist/recipe-bridges/*.jar
          if-no-files-found: error
          retention-days: 7

  java-engine:
    name: Java engine · Java 22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile and test engine
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean build

      - name: Upload engine JAR for wrapper jobs
        uses: actions/upload-artifact@v7
        with:
          name: minesport-engine-ci
          path: engine/build/libs/minesport-engine-*.jar
          if-no-files-found: error
          retention-days: 7

  blender-translator:
    name: Blender translator · Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate pyproject
        run: python -c "import pathlib,tomllib; tomllib.loads(pathlib.Path('wrapper/blendertranslator/pyproject.toml').read_text(encoding='utf-8')); print('pyproject.toml OK')"

      - name: Compile translator Python
        run: python -m compileall -q wrapper/blendertranslator/minesport_translator

  wrapper:
    name: Wrapper release · ${{ matrix.name }}
    needs: java-engine
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-latest
            binary: minesport
          - name: Windows amd64
            os: windows-latest
            binary: minesport.exe
          - name: macOS
            os: macos-latest
            binary: minesport

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download compiled engine
        uses: actions/download-artifact@v7
        with:
          name: minesport-engine-ci
          path: engine/build/libs

      - name: Set up Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum

      - name: Install Linux Fyne/OpenGL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgl1-mesa-dev xorg-dev

      - name: Check Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          gcc --version
          if ($LASTEXITCODE -ne 0) { throw 'gcc is required for Fyne/CGO' }

      - name: Check macOS C compiler
        if: runner.os == 'macOS'
        run: clang --version

      - name: Verify Go module files are tidy
        working-directory: wrapper
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Compile all Go packages
        working-directory: wrapper
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: go test ./...

      - name: Generate embedded engine source
        working-directory: wrapper
        shell: bash
        run: |
          engine_jars=(../engine/build/libs/minesport-engine-*.jar)
          engine_jar="${engine_jars[0]}"
          if [ ! -f "$engine_jar" ]; then
            echo "ERROR: engine JAR artifact is missing" >&2
            exit 1
          fi
          echo "Embedding: $engine_jar"
          go run ./cmd/embed-engine -input "$engine_jar" -output embedded_engine_generated.go

      - name: Compile release configuration
        working-directory: wrapper
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -tags minesport_embedded_engine -trimpath -ldflags='-H windowsgui -s -w' -o dist/minesport.exe .
          else
            go build -tags minesport_embedded_engine -trimpath -ldflags='-s -w' -o dist/minesport .
          fi

      - name: Compile all packages with embedded-engine tag
        working-directory: wrapper
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: go test -tags minesport_embedded_engine ./...

      - name: Validate build script syntax
        if: runner.os == 'Linux'
        shell: bash
        run: bash -n build.sh

      - name: Validate PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(
            (Join-Path $env:GITHUB_WORKSPACE 'build.ps1'),
            (Join-Path $env:GITHUB_WORKSPACE 'installer\windows\install-blender.ps1')
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file: $($_.Message)" }
              throw "$file contains syntax errors"
            }
            Write-Host "$file syntax OK"
          }

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: minesport-${{ runner.os }}-${{ runner.arch }}
          path: wrapper/dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  windows-installer:
    name: Windows installers · MSI + EXE
    needs:
      - wrapper
      - fabric-bridge-bundled
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Windows Minesport binary
        uses: actions/download-artifact@v7
        with:
          name: minesport-Windows-X64
          path: wrapper/dist

      - name: Download bundled 1.21.10 bridge
        uses: actions/download-artifact@v7
        with:
          name: fabric-bridge-1.21.10
          path: dist/bundled-bridge

      - name: Locate WiX and Inno Setup
        shell: pwsh
        run: |
          $wixCandidates = @(
            'C:\Program Files (x86)\WiX Toolset v3.14\bin',
            'C:\Program Files (x86)\WiX Toolset v3.11\bin'
          )
          $wix = $wixCandidates | Where-Object {
            (Test-Path (Join-Path $_ 'candle.exe')) -and
            (Test-Path (Join-Path $_ 'light.exe'))
          } | Select-Object -First 1
          if (-not $wix) { throw 'WiX 3.x was not found on the Windows runner.' }

          $innoCandidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $innoCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 6 was not found on the Windows runner.' }

          "WIX_BIN=$wix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'dist\installer') | Out-Null

      - name: Build MSI
        shell: pwsh
        run: |
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'installer\windows')
          try {
            & (Join-Path $env:WIX_BIN 'candle.exe') `
              -arch x64 `
              -ext WixUtilExtension `
              "-dSourceDir=$env:GITHUB_WORKSPACE" `
              Product.wxs
            if ($LASTEXITCODE -ne 0) { throw 'WiX candle failed.' }

            & (Join-Path $env:WIX_BIN 'light.exe') `
              -ext WixUIExtension `
              -ext WixUtilExtension `
              -out (Join-Path $env:GITHUB_WORKSPACE 'dist\installer\Minesport-0.1.0-x64.msi') `
              Product.wixobj
            if ($LASTEXITCODE -ne 0) { throw 'WiX light failed.' }
          } finally {
            Pop-Location
          }

      - name: Build setup EXE
        shell: pwsh
        run: |
          & $env:ISCC "/DSourceDir=$env:GITHUB_WORKSPACE" (Join-Path $env:GITHUB_WORKSPACE 'installer\windows\minesport.iss')
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }

      - name: Verify installer outputs
        shell: pwsh
        run: |
          $msi = Join-Path $env:GITHUB_WORKSPACE 'dist\installer\Minesport-0.1.0-x64.msi'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\installer\Minesport-0.1.0-Setup-x64.exe'
          if (-not (Test-Path $msi)) { throw "Missing MSI: $msi" }
          if (-not (Test-Path $exe)) { throw "Missing setup EXE: $exe" }
          Get-Item $msi, $exe | Format-Table Name, Length

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: minesport-windows-installers
          path: |
            dist/installer/Minesport-0.1.0-x64.msi
            dist/installer/Minesport-0.1.0-Setup-x64.exe
          if-no-files-found: error
          retention-days: 7

  compile-clean:
    name: Compile cleanly
    if: always()
    needs:
      - fabric-bridge-bundled
      - fabric-bridge-recipes
      - java-engine
      - blender-translator
      - wrapper
      - windows-installer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUNDLED_BRIDGE_RESULT: ${{ needs.fabric-bridge-bundled.result }}
      RECIPE_BRIDGE_RESULT: ${{ needs.fabric-bridge-recipes.result }}
      ENGINE_RESULT: ${{ needs.java-engine.result }}
      TRANSLATOR_RESULT: ${{ needs.blender-translator.result }}
      WRAPPER_RESULT: ${{ needs.wrapper.result }}
      INSTALLER_RESULT: ${{ needs.windows-installer.result }}
    steps:
      - name: Report compile status
        run: |
          echo "Bundled bridge:      $BUNDLED_BRIDGE_RESULT"
          echo "Dynamic recipes:     $RECIPE_BRIDGE_RESULT"
          echo "Java engine:         $ENGINE_RESULT"
          echo "Blender translator:  $TRANSLATOR_RESULT"
          echo "Wrapper matrix:      $WRAPPER_RESULT"
          echo "Windows installers:  $INSTALLER_RESULT"

          {
            echo "## Minesport compile report"
            echo
            echo "| Component | Result |"
            echo "|---|---|"
            echo "| Bundled bridge · 1.21.9–1.21.10 | $BUNDLED_BRIDGE_RESULT |"
            echo "| JSON recipes · 1.21.11 + 26.2 + 26.3 snapshot | $RECIPE_BRIDGE_RESULT |"
            echo "| Java engine | $ENGINE_RESULT |"
            echo "| Blender translator | $TRANSLATOR_RESULT |"
            echo "| Wrapper: Linux + Windows + macOS | $WRAPPER_RESULT |"
            echo "| Windows MSI + setup EXE | $INSTALLER_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$BUNDLED_BRIDGE_RESULT" = "success" ] && \
             [ "$RECIPE_BRIDGE_RESULT" = "success" ] && \
             [ "$ENGINE_RESULT" = "success" ] && \
             [ "$TRANSLATOR_RESULT" = "success" ] && \
             [ "$WRAPPER_RESULT" = "success" ] && \
             [ "$INSTALLER_RESULT" = "success" ]; then
            echo "✅ Everything compiled cleanly." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "❌ One or more compile/package jobs failed. Open the failed job above for the exact compiler output." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
