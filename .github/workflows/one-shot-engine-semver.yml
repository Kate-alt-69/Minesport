name: One Shot Engine SemVer Precedence

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: one-shot-engine-semver
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.head_commit.message == 'CHORE | stage engine semver precedence'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt
      - name: Apply SemVer precedence fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('desktop/src/engine_update.rs')
          text = path.read_text(encoding='utf-8')

          def once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              text = text.replace(old, new, 1)

          once(
              '''    if manifest.version.trim().is_empty() {
                  bail!("engine manifest version is empty");
              }
              if manifest.protocol_version == 0 {''',
              '''    if manifest.version.trim().is_empty() {
                  bail!("engine manifest version is empty");
              }
              if parse_semver(&manifest.version).is_none() {
                  bail!("engine manifest version is not valid semantic versioning");
              }
              if manifest.protocol_version == 0 {''',
              'manifest semver validation',
          )

          old = r'''fn compare_versions(left: &str, right: &str) -> Result<Ordering> {
              let left = parse_semver_core(left)
                  .ok_or_else(|| anyhow!("engine version is not semantic version x.y.z: {left}"))?;
              let right = parse_semver_core(right)
                  .ok_or_else(|| anyhow!("engine version is not semantic version x.y.z: {right}"))?;
              Ok(left.cmp(&right))
          }

          fn parse_semver_core(value: &str) -> Option<(u64, u64, u64)> {
              let core = value
                  .trim()
                  .trim_start_matches(['v', 'V'])
                  .split(['-', '+'])
                  .next()?;
              let mut parts = core.split('.');
              let major = parts.next()?.parse().ok()?;
              let minor = parts.next()?.parse().ok()?;
              let patch = parts.next()?.parse().ok()?;
              if parts.next().is_some() {
                  return None;
              }
              Some((major, minor, patch))
          }
          '''
          new = r'''#[derive(Debug, Clone, Eq, PartialEq)]
          struct ParsedSemver {
              core: (u64, u64, u64),
              prerelease: Vec<SemverIdentifier>,
          }

          #[derive(Debug, Clone, Eq, PartialEq)]
          enum SemverIdentifier {
              Numeric(String),
              Text(String),
          }

          fn compare_versions(left: &str, right: &str) -> Result<Ordering> {
              let left = parse_semver(left).ok_or_else(|| {
                  anyhow!("engine version is not valid semantic versioning: {left}")
              })?;
              let right = parse_semver(right).ok_or_else(|| {
                  anyhow!("engine version is not valid semantic versioning: {right}")
              })?;

              let core = left.core.cmp(&right.core);
              if core != Ordering::Equal {
                  return Ok(core);
              }
              Ok(compare_prerelease(&left.prerelease, &right.prerelease))
          }

          fn compare_prerelease(left: &[SemverIdentifier], right: &[SemverIdentifier]) -> Ordering {
              match (left.is_empty(), right.is_empty()) {
                  (true, true) => return Ordering::Equal,
                  (true, false) => return Ordering::Greater,
                  (false, true) => return Ordering::Less,
                  (false, false) => {}
              }

              for (left, right) in left.iter().zip(right) {
                  let ordering = match (left, right) {
                      (SemverIdentifier::Numeric(left), SemverIdentifier::Numeric(right)) => left
                          .len()
                          .cmp(&right.len())
                          .then_with(|| left.cmp(right)),
                      (SemverIdentifier::Numeric(_), SemverIdentifier::Text(_)) => Ordering::Less,
                      (SemverIdentifier::Text(_), SemverIdentifier::Numeric(_)) => Ordering::Greater,
                      (SemverIdentifier::Text(left), SemverIdentifier::Text(right)) => left.cmp(right),
                  };
                  if ordering != Ordering::Equal {
                      return ordering;
                  }
              }
              left.len().cmp(&right.len())
          }

          fn parse_semver(value: &str) -> Option<ParsedSemver> {
              let value = value.trim();
              let value = value
                  .strip_prefix('v')
                  .or_else(|| value.strip_prefix('V'))
                  .unwrap_or(value);
              if value.is_empty() {
                  return None;
              }

              let (version, build) = match value.split_once('+') {
                  Some((version, build)) => (version, Some(build)),
                  None => (value, None),
              };
              if let Some(build) = build {
                  if !valid_semver_identifiers(build, false) {
                      return None;
                  }
              }

              let (core, prerelease) = match version.split_once('-') {
                  Some((core, prerelease)) => (core, Some(prerelease)),
                  None => (version, None),
              };
              let mut parts = core.split('.');
              let major = parse_semver_core_number(parts.next()?)?;
              let minor = parse_semver_core_number(parts.next()?)?;
              let patch = parse_semver_core_number(parts.next()?)?;
              if parts.next().is_some() {
                  return None;
              }

              let prerelease = match prerelease {
                  Some(prerelease) => parse_prerelease(prerelease)?,
                  None => Vec::new(),
              };
              Some(ParsedSemver {
                  core: (major, minor, patch),
                  prerelease,
              })
          }

          fn parse_semver_core_number(value: &str) -> Option<u64> {
              if value.is_empty()
                  || !value.bytes().all(|byte| byte.is_ascii_digit())
                  || (value.len() > 1 && value.starts_with('0'))
              {
                  return None;
              }
              value.parse().ok()
          }

          fn parse_prerelease(value: &str) -> Option<Vec<SemverIdentifier>> {
              if !valid_semver_identifiers(value, true) {
                  return None;
              }
              value
                  .split('.')
                  .map(|identifier| {
                      if identifier.bytes().all(|byte| byte.is_ascii_digit()) {
                          if identifier.len() > 1 && identifier.starts_with('0') {
                              None
                          } else {
                              Some(SemverIdentifier::Numeric(identifier.to_string()))
                          }
                      } else {
                          Some(SemverIdentifier::Text(identifier.to_string()))
                      }
                  })
                  .collect()
          }

          fn valid_semver_identifiers(value: &str, _prerelease: bool) -> bool {
              !value.is_empty()
                  && value.split('.').all(|identifier| {
                      !identifier.is_empty()
                          && identifier.bytes().all(|byte| {
                              byte.is_ascii_alphanumeric() || byte == b'-'
                          })
                  })
          }
          '''
          once(old, new, 'semver comparator')

          once(
              '''        assert_eq!(
                      compare_versions("0.3.0-beta.1", "0.2.99").unwrap(),
                      Ordering::Greater
                  );''',
              '''        assert_eq!(
                      compare_versions("0.3.0-beta.1", "0.2.99").unwrap(),
                      Ordering::Greater
                  );
                  assert_eq!(
                      compare_versions("0.3.0", "0.3.0-beta.1").unwrap(),
                      Ordering::Greater
                  );
                  assert_eq!(
                      compare_versions("0.3.0-beta.1", "0.3.0").unwrap(),
                      Ordering::Less
                  );
                  assert_eq!(
                      compare_versions("0.3.0-beta.11", "0.3.0-beta.2").unwrap(),
                      Ordering::Greater
                  );
                  assert_eq!(
                      compare_versions("0.3.0-beta.1", "0.3.0-beta.alpha").unwrap(),
                      Ordering::Less
                  );
                  assert_eq!(
                      compare_versions("0.3.0+build.9", "0.3.0+build.1").unwrap(),
                      Ordering::Equal
                  );
                  assert!(compare_versions("0.3.0-beta.01", "0.3.0-beta.1").is_err());
                  assert!(compare_versions("0.3.0-alpha..1", "0.3.0-alpha.1").is_err());''',
              'semver regression tests',
          )

          path.write_text(text, encoding='utf-8')
          PY
          rustfmt desktop/src/engine_update.rs
          git diff --check
      - name: Test Windows engine updater SemVer
        shell: bash
        env:
          MINESPORT_FAST_CHECK: '1'
        run: cargo test --manifest-path desktop/Cargo.toml engine_update::tests
      - name: Publish tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git stash push -m engine-semver-tested
          git pull --rebase origin main
          git stash pop
          git diff --check
          subjects="$(git log origin/main --format=%s)"
          max="$(printf '%s\n' "$subjects" | grep -oE 'BUG-[0-9]+' | cut -d- -f2 | sort -n | tail -1)"
          next=$(( ${max:-0} + 1 ))
          git rm .github/workflows/one-shot-engine-semver.yml
          git add desktop/src/engine_update.rs
          git diff --cached --check
          git commit -m "FIX | BUG-${next} Respect engine prerelease precedence"
          git push origin HEAD:main
