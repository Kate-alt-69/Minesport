name: One Shot Runtime Cache Readiness

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: one-shot-runtime-cache-readiness
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.head_commit.message == 'CHORE | stage runtime cache readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Install Rust/Slint build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Apply runtime cache readiness fix
        run: |
          python .github/patches/apply-runtime-registry-followups.py
          rustfmt desktop/src/registry_stream.rs desktop/src/runtime_cache.rs
          git diff --check

      - name: Test runtime cache readiness
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          cargo test --manifest-path desktop/Cargo.toml registry::tests
          cargo test --manifest-path desktop/Cargo.toml runtime_cache::tests

      - name: Publish tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          subjects="$(git log origin/main --format=%s)"
          max="$(printf '%s\n' "$subjects" | grep -oE 'BUG-[0-9]+' | cut -d- -f2 | sort -n | tail -1)"
          next=$(( ${max:-0} + 1 ))

          git add desktop/src/registry_stream.rs desktop/src/runtime_cache.rs
          git diff --cached --check
          git commit -m "FIX | BUG-${next} Reject incomplete runtime registry caches"

          git fetch origin main
          current_max="$(git log origin/main --format=%s | grep -oE 'BUG-[0-9]+' | cut -d- -f2 | sort -n | tail -1)"
          if [ "${current_max:-0}" -ge "$next" ]; then
            echo "BUG numbering changed while validation ran; refusing an ambiguous publish" >&2
            exit 1
          fi
          git rebase origin/main
          git push origin HEAD:main
