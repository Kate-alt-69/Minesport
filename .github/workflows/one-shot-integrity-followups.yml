name: One Shot Integrity Followups
# One-shot gate for validated export/runtime/registry/build integrity fixes.
# staged: export bundle + runtime snapshot + registry transaction + bridge retry

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: one-shot-integrity-followups
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.head_commit.message == 'CHORE | stage integrity followups'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - uses: gradle/actions/setup-gradle@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Install desktop test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev xvfb

      - name: Restore embedded engine artifact
        uses: actions/download-artifact@v7
        with:
          name: minesport-engine-ci
          path: engine/build/libs
          run-id: 33797953559
          github-token: ${{ github.token }}

      - name: Restore embedded loader bridges
        uses: actions/download-artifact@v7
        with:
          name: loader-bridges-1.21.10
          path: dist/bundled-export-worker
          run-id: 33797953559
          github-token: ${{ github.token }}

      - name: Apply and test atomic export bundle
        shell: bash
        run: |
          set -euo pipefail
          python .github/patches/apply-atomic-export-bundle-v2.py
          git diff --check
          chmod +x engine/gradlew
          (cd engine && ./gradlew --no-daemon --stacktrace clean build)

          test -f engine/src/main/java/dev/kastrick/minesport/export/AtomicExportBundle.java
          test -f engine/src/test/java/dev/kastrick/minesport/export/AtomicExportBundleTest.java
          grep -Fq 'exportBundle.publish();' engine/src/main/java/dev/kastrick/minesport/IpcMode.java
          grep -Fq 'writer.checkError()' engine/src/main/java/dev/kastrick/minesport/export/ObjExporter.java
          grep -Fq 'writer.checkError()' engine/src/main/java/dev/kastrick/minesport/export/GltfExporter.java
          grep -Fq 'w.checkError()' engine/src/main/java/dev/kastrick/minesport/export/MtlExporter.java
          grep -Fq 'cleanupTreeBestEffort' engine/src/main/java/dev/kastrick/minesport/export/AtomicExportBundle.java

          git add \
            engine/src/main/java/dev/kastrick/minesport/IpcMode.java \
            engine/src/main/java/dev/kastrick/minesport/export/AtomicExportBundle.java \
            engine/src/main/java/dev/kastrick/minesport/export/ObjExporter.java \
            engine/src/main/java/dev/kastrick/minesport/export/MtlExporter.java \
            engine/src/main/java/dev/kastrick/minesport/export/GltfExporter.java \
            engine/src/test/java/dev/kastrick/minesport/export/AtomicExportBundleTest.java
          git rm .github/patches/apply-atomic-export-bundle.py .github/patches/apply-atomic-export-bundle-v2.py
          git diff --cached --binary --full-index > /tmp/export-integrity.patch
          test -s /tmp/export-integrity.patch
          git reset --hard HEAD

      - name: Apply and test staged runtime snapshot
        shell: bash
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          set -euo pipefail
          python .github/patches/apply-runtime-staged-snapshot.py
          cargo fmt --manifest-path desktop/Cargo.toml
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml runtime_worker::tests

          grep -Fq 'let staged_raw_fingerprint = runtime_worker_inputs_fingerprint' desktop/src/runtime_worker.rs
          grep -Fq 'copy_file_snapshot(&path, &destination)' desktop/src/runtime_worker.rs
          grep -Fq 'staged_runtime_inputs_are_isolated_from_source_mutation' desktop/src/runtime_worker.rs
          if grep -Fq 'let existing = registry::snapshot_path(&cache_root, &version, &fingerprint);' desktop/src/runtime_worker.rs; then
            echo 'unsafe pre-snapshot cache reuse still present' >&2
            exit 1
          fi

          git add desktop/src/runtime_worker.rs
          git rm .github/patches/apply-runtime-staged-snapshot.py
          git diff --cached --binary --full-index > /tmp/runtime-snapshot.patch
          test -s /tmp/runtime-snapshot.patch
          git reset --hard HEAD

      - name: Apply and test transactional registry replacement
        shell: bash
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          set -euo pipefail
          python .github/patches/apply-runtime-registry-transaction.py
          cargo fmt --manifest-path desktop/Cargo.toml
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml registry::tests
          cargo check --locked --release --manifest-path desktop/Cargo.toml --all-targets

          grep -Fq 'stage_ready_receipt(' desktop/src/registry_stream.rs
          grep -Fq 'install_registry_snapshot(' desktop/src/registry_stream.rs
          grep -Fq 'failed_snapshot_replacement_restores_last_good_registry_and_receipt' desktop/src/registry_stream.rs

          git add desktop/src/registry_stream.rs
          git rm .github/patches/apply-runtime-registry-transaction.py
          git diff --cached --binary --full-index > /tmp/registry-transaction.patch
          test -s /tmp/registry-transaction.patch
          git reset --hard HEAD

      - name: Apply and validate transient bridge build retry
        shell: bash
        run: |
          set -euo pipefail
          python .github/patches/apply-bridge-build-retry.py
          git diff --check
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "build.ps1"), [ref]$tokens, [ref]$errors) > $null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          grep -Fq 'Test-TransientBridgeBuildFailure' build.ps1
          grep -Fq 'Connection reset' build.ps1
          grep -Fq 'MINESPORT_BRIDGE_BUILD_ATTEMPTS' build.ps1
          grep -Fq 'Invoke-BridgeGradleBuild $bridge' build.ps1

          git add build.ps1
          git rm .github/patches/apply-bridge-build-retry.py
          git diff --cached --binary --full-index > /tmp/bridge-retry.patch
          test -s /tmp/bridge-retry.patch
          git reset --hard HEAD

      - name: Publish tested fixes
        shell: bash
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git pull --rebase origin main
          chmod +x engine/gradlew

          subjects="$(git log origin/main --format=%s)"
          max="$(printf '%s\n' "$subjects" | grep -oE 'BUG-[0-9]+' | cut -d- -f2 | sort -n | tail -1)"
          export_bug=$(( ${max:-0} + 1 ))
          runtime_bug=$(( export_bug + 1 ))
          registry_bug=$(( runtime_bug + 1 ))
          bridge_bug=$(( registry_bug + 1 ))

          git apply --index /tmp/export-integrity.patch
          git diff --cached --check
          (cd engine && ./gradlew --no-daemon --stacktrace test)
          git commit -m "FIX | BUG-${export_bug} Publish OBJ and glTF export bundles atomically"

          git apply --index /tmp/runtime-snapshot.patch
          git diff --cached --check
          rustfmt --edition 2024 --check desktop/src/runtime_worker.rs
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml runtime_worker::tests::staged_runtime_inputs_are_isolated_from_source_mutation
          git commit -m "FIX | BUG-${runtime_bug} Snapshot runtime inputs before cache reuse"

          git apply --index /tmp/registry-transaction.patch
          git diff --cached --check
          rustfmt --edition 2024 --check desktop/src/registry_stream.rs
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml registry::tests::failed_snapshot_replacement_restores_last_good_registry_and_receipt
          git commit -m "FIX | BUG-${registry_bug} Preserve runtime registry during replacement failures"

          git apply --index /tmp/bridge-retry.patch
          git diff --cached --check
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "build.ps1"), [ref]$tokens, [ref]$errors) > $null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          git commit -m "FIX | BUG-${bridge_bug} Retry transient loader dependency failures"

          git push origin HEAD:main
