name: Windows build script regression

on:
  push:
    paths:
      - build.ps1
      - tests/windows-build-retry.ps1
      - .github/workflows/windows-build-script.yml
  pull_request:
    paths:
      - build.ps1
      - tests/windows-build-retry.ps1
      - .github/workflows/windows-build-script.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-script-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retry-policy:
    name: Gradle failure handling · ${{ matrix.shell }}
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test real Windows batch exit codes and stderr
        shell: ${{ matrix.shell }}
        run: .\tests\windows-build-retry.ps1
