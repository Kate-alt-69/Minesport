name: One Shot Loader Metadata Parsers

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-loader-metadata-parsers.yml"
      - ".github/loader_metadata_parser_fix.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: |
          python3 -m py_compile .github/loader_metadata_parser_fix.py
          python3 .github/loader_metadata_parser_fix.py
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "22"

      - name: Test Java engine
        working-directory: engine
        run: bash ./gradlew --no-daemon test

      - name: Commit tested source fix and remove one-shot gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engine/src/main/java/dev/kastrick/minesport/resolver/FabricResolver.java \
            engine/src/main/java/dev/kastrick/minesport/resolver/QuiltResolver.java \
            engine/src/test/java/dev/kastrick/minesport/resolver/LoaderMetadataParserTest.java
          git rm \
            .github/loader_metadata_parser_fix.py \
            .github/workflows/one-shot-loader-metadata-parsers.yml
          git diff --cached --check
          git commit -m "FIX | BUG-064 Parse loader metadata with Gson"
          git push origin HEAD:main
