name: One Shot Workflow Version Artifact V8

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-workflow-version-artifact-v8.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Generate dynamic-version workflows
        run: |
          python .github/workflow_version_v8_patch.py
          grep -q 'MINESPORT_VERSION' .github/workflows/build.yml
          grep -q 'MINESPORT_VERSION' .github/workflows/release-windows.yml
          ! grep -q 'Minesport-0.2.1' .github/workflows/build.yml
          ! grep -q 'Minesport-0.2.1' .github/workflows/release-windows.yml
      - uses: actions/upload-artifact@v7
        with:
          name: minesport-dynamic-version-workflows-v8
          path: |
            .github/workflows/build.yml
            .github/workflows/release-windows.yml
          if-no-files-found: error
          retention-days: 1
