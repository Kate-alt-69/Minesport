name: One Shot Export Isolation Followups
# Reapply structural helpers after rebasing so concurrent main changes cannot
# stale prebuilt index patches.

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: one-shot-export-isolation-followups
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.head_commit.message == 'CHORE | stage export isolation followups'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - uses: gradle/actions/setup-gradle@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Install desktop test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev xvfb

      - name: Restore embedded engine artifact
        uses: actions/download-artifact@v7
        with:
          name: minesport-engine-ci
          path: engine/build/libs
          run-id: 33797953559
          github-token: ${{ github.token }}

      - name: Restore embedded loader bridges
        uses: actions/download-artifact@v7
        with:
          name: loader-bridges-1.21.10
          path: dist/bundled-export-worker
          run-id: 33797953559
          github-token: ${{ github.token }}

      - name: Validate per-export OBJ texture assets
        shell: bash
        run: |
          set -euo pipefail
          python .github/patches/apply-export-isolation-followups.py java
          git diff --check
          chmod +x engine/gradlew
          (cd engine && ./gradlew --no-daemon --stacktrace clean test)
          grep -Fq 'baseName + "_textures"' engine/src/main/java/dev/kastrick/minesport/export/MtlExporter.java
          grep -Fq 'objTexturesAreIsolatedPerExportInsteadOfSharedGlobally' engine/src/test/java/dev/kastrick/minesport/export/ExportRegressionTest.java
          git reset --hard HEAD

      - name: Validate export companion collision detection
        shell: bash
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          set -euo pipefail
          python .github/patches/apply-export-isolation-followups.py rust
          cargo fmt --manifest-path desktop/Cargo.toml
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml tests::export_bundle_collision_detection_includes_companion_files_and_assets
          grep -Fq 'fn export_bundle_conflicts' desktop/src/app.rs
          grep -Fq 'stem}_textures' desktop/src/app.rs
          git reset --hard HEAD

      - name: Validate Windows reserved export names
        shell: bash
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          set -euo pipefail
          python .github/patches/apply-export-name-safety.py
          cargo fmt --manifest-path desktop/Cargo.toml
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml tests::sanitizes_windows_reserved_device_export_names
          cargo check --locked --release --manifest-path desktop/Cargo.toml --all-targets
          grep -Fq 'fn windows_reserved_export_name' desktop/src/app.rs
          git reset --hard HEAD

      - name: Validate capture-worker cache identity
        shell: bash
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          set -euo pipefail
          python .github/patches/apply-runtime-capture-identity.py
          cargo fmt --manifest-path desktop/Cargo.toml
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml runtime_worker::tests::capture_worker_changes_invalidate_runtime_cache_identity
          grep -Fq 'runtime_worker_capture_fingerprint' desktop/src/runtime_worker.rs
          grep -Fq 'minesport-runtime-worker-cache-v2' desktop/src/runtime_worker.rs
          git reset --hard HEAD

      - name: Validate reusable Windows Gradle network retry
        shell: bash
        run: |
          set -euo pipefail
          python .github/patches/apply-gradle-build-retry-generalization.py
          git diff --check
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "build.ps1"), [ref]$tokens, [ref]$errors) > $null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          grep -Fq 'function Invoke-GradleBuildWithRetry' build.ps1
          grep -Fq "Invoke-GradleBuildWithRetry 'Java engine' 'engine' \$Fresh" build.ps1
          grep -Fq 'MINESPORT_GRADLE_BUILD_ATTEMPTS' build.ps1
          git reset --hard HEAD

      - name: Validate POSIX Gradle network retry
        shell: bash
        run: |
          set -euo pipefail
          python .github/patches/apply-posix-gradle-retry.py
          git diff --check
          bash -n build.sh
          grep -Fq 'transient_gradle_failure' build.sh
          grep -Fq 'MINESPORT_GRADLE_BUILD_ATTEMPTS' build.sh
          grep -Fq 'run_gradle_build "$name Export Worker"' build.sh
          grep -Fq 'run_gradle_build "Java engine"' build.sh
          git reset --hard HEAD

      - name: Validate transactional runtime asset replacement
        shell: bash
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          set -euo pipefail
          python .github/patches/apply-runtime-asset-transaction.py
          rustfmt --edition 2024 desktop/src/runtime.rs
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml runtime::tests::failed_runtime_asset_install_restores_last_good_file
          grep -Fq 'fn install_runtime_asset' desktop/src/runtime.rs
          grep -Fq 'file.sync_all()' desktop/src/runtime.rs
          git reset --hard HEAD

      - name: Validate full scoped registry path identity
        shell: bash
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          set -euo pipefail
          python .github/patches/apply-registry-fingerprint-path.py
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml registry::tests::long_scoped_fingerprint_paths_preserve_full_identity
          cargo check --locked --release --manifest-path desktop/Cargo.toml --all-targets
          grep -Fq 'fingerprint_component(fingerprint)' desktop/src/registry.rs
          git reset --hard HEAD

      - name: Publish rebased tested fixes
        shell: bash
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          chmod +x engine/gradlew

          subjects="$(git log origin/main --format=%s)"
          max="$(printf '%s\n' "$subjects" | grep -oE 'BUG-[0-9]+' | cut -d- -f2 | sort -n | tail -1)"
          texture_bug=$(( ${max:-0} + 1 ))
          collision_bug=$(( texture_bug + 1 ))
          name_bug=$(( collision_bug + 1 ))
          identity_bug=$(( name_bug + 1 ))
          engine_retry_bug=$(( identity_bug + 1 ))
          posix_retry_bug=$(( engine_retry_bug + 1 ))
          asset_bug=$(( posix_retry_bug + 1 ))
          path_bug=$(( asset_bug + 1 ))

          python .github/patches/apply-export-isolation-followups.py java
          git diff --check
          (cd engine && ./gradlew --no-daemon --stacktrace test --tests dev.kastrick.minesport.export.ExportRegressionTest)
          git add engine/src/main/java/dev/kastrick/minesport/export/MtlExporter.java \
            engine/src/test/java/dev/kastrick/minesport/export/ExportRegressionTest.java
          git diff --cached --check
          git commit -m "FIX | BUG-${texture_bug} Isolate OBJ texture assets per export"

          python .github/patches/apply-export-isolation-followups.py rust
          rustfmt --edition 2024 desktop/src/app.rs
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml tests::export_bundle_collision_detection_includes_companion_files_and_assets
          git add desktop/src/app.rs
          git diff --cached --check
          git commit -m "FIX | BUG-${collision_bug} Detect export companion collisions"

          python .github/patches/apply-export-name-safety.py
          rustfmt --edition 2024 desktop/src/app.rs
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml tests::sanitizes_windows_reserved_device_export_names
          git add desktop/src/app.rs
          git rm .github/patches/apply-export-isolation-followups.py .github/patches/apply-export-name-safety.py
          git diff --cached --check
          git commit -m "FIX | BUG-${name_bug} Sanitize Windows reserved export names"

          python .github/patches/apply-runtime-capture-identity.py
          rustfmt --edition 2024 desktop/src/runtime_worker.rs
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml runtime_worker::tests::capture_worker_changes_invalidate_runtime_cache_identity
          git add desktop/src/runtime_worker.rs
          git rm .github/patches/apply-runtime-capture-identity.py
          git diff --cached --check
          git commit -m "FIX | BUG-${identity_bug} Include capture worker in runtime cache identity"

          python .github/patches/apply-gradle-build-retry-generalization.py
          git diff --check
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "build.ps1"), [ref]$tokens, [ref]$errors) > $null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          git add build.ps1
          git rm .github/patches/apply-gradle-build-retry-generalization.py
          git diff --cached --check
          git commit -m "FIX | BUG-${engine_retry_bug} Retry transient Java engine dependency failures"

          python .github/patches/apply-posix-gradle-retry.py
          git diff --check
          bash -n build.sh
          git add build.sh
          git rm .github/patches/apply-posix-gradle-retry.py
          git diff --cached --check
          git commit -m "FIX | BUG-${posix_retry_bug} Retry transient POSIX Gradle dependency failures"

          python .github/patches/apply-runtime-asset-transaction.py
          rustfmt --edition 2024 desktop/src/runtime.rs
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml runtime::tests::failed_runtime_asset_install_restores_last_good_file
          git add desktop/src/runtime.rs
          git rm .github/patches/apply-runtime-asset-transaction.py
          git diff --cached --check
          git commit -m "FIX | BUG-${asset_bug} Preserve runtime assets during replacement failures"

          python .github/patches/apply-registry-fingerprint-path.py
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml registry::tests::long_scoped_fingerprint_paths_preserve_full_identity
          git add desktop/src/registry.rs
          git rm .github/patches/apply-registry-fingerprint-path.py
          git diff --cached --check
          git commit -m "FIX | BUG-${path_bug} Preserve full scoped registry cache identity"

          echo 'Tracked state before final publisher cleanup:'
          git status --short
          git restore --staged --worktree .
          echo 'Tracked state after final publisher cleanup:'
          git status --short
          git pull --rebase origin main
          (cd engine && ./gradlew --no-daemon --stacktrace test --tests dev.kastrick.minesport.export.ExportRegressionTest)
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml tests::export_bundle_collision_detection_includes_companion_files_and_assets
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml tests::sanitizes_windows_reserved_device_export_names
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml runtime_worker::tests::capture_worker_changes_invalidate_runtime_cache_identity
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml runtime::tests::failed_runtime_asset_install_restores_last_good_file
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml registry::tests::long_scoped_fingerprint_paths_preserve_full_identity
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "build.ps1"), [ref]$tokens, [ref]$errors) > $null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          bash -n build.sh
          git push origin HEAD:main
