name: One Shot Minesport 0.2.1 Export Worker Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/export_worker_021_patch.py'
      - '.github/workflows/one-shot-export-worker-021.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply Export Worker migration
        run: python3 .github/export_worker_021_patch.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Fabric Export Worker
        working-directory: minesport-bridge-fabric
        run: bash ./gradlew --no-daemon clean build

      - name: Build Forge Export Worker
        working-directory: minesport-bridge-forge
        run: bash ./gradlew --no-daemon clean build

      - name: Build NeoForge Export Worker
        working-directory: minesport-bridge-neoforge
        run: bash ./gradlew --no-daemon clean build

      - name: Build Quilt Export Worker
        working-directory: minesport-bridge-quilt
        run: bash ./gradlew --no-daemon clean build

      - name: Verify exact worker artifact names
        run: |
          test -s minesport-bridge-fabric/build/libs/minesport_export_worker-fabric-1.21.10.jar
          test -s minesport-bridge-forge/build/libs/minesport_export_worker-forge-1.21.10.jar
          test -s minesport-bridge-neoforge/build/libs/minesport_export_worker-neoforge-1.21.10.jar
          test -s minesport-bridge-quilt/build/libs/minesport_export_worker-quilt-1.21.10.jar
          mkdir -p dist/bundled-export-worker
          cp minesport-bridge-fabric/build/libs/minesport_export_worker-fabric-1.21.10.jar dist/bundled-export-worker/
          cp minesport-bridge-forge/build/libs/minesport_export_worker-forge-1.21.10.jar dist/bundled-export-worker/
          cp minesport-bridge-neoforge/build/libs/minesport_export_worker-neoforge-1.21.10.jar dist/bundled-export-worker/
          cp minesport-bridge-quilt/build/libs/minesport_export_worker-quilt-1.21.10.jar dist/bundled-export-worker/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - name: Test Java engine
        working-directory: engine
        run: bash ./gradlew --no-daemon test

      - name: Install Slint build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev

      - name: Check Rust desktop
        working-directory: desktop
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          cargo check --locked --all-targets
          cargo test --locked --all-targets

      - name: Validate build scripts and migration
        run: |
          bash -n build.sh
          pwsh -NoProfile -Command "[void][ScriptBlock]::Create((Get-Content -Raw build.ps1))"
          git diff --check
          grep -q 'version = "0.2.1"' desktop/Cargo.toml
          grep -q "version = '0.2.1'" engine/build.gradle
          grep -q 'MINESPORT_EXPORT_WORKER_FABRIC_JAR' desktop/build.rs
          grep -q 'bundled-export-worker' build.ps1
          grep -q 'bundled-export-worker' build.sh
          grep -q 'minesport_export_worker-fabric-1.21.10.jar' desktop/src/runtime.rs
          ! grep -q 'Thread.sleep(250)' minesport-bridge-fabric/src/client/java/dev/kastrick/minesport/bridge/MinesportBridge.java
          test -f .github/workflows/export-worker-loaders.yml
          test ! -f .github/workflows/bridge-loaders.yml

      - name: Publish tested 0.2.1 Export Worker migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/export_worker_021_patch.py .github/workflows/one-shot-export-worker-021.yml
          rm -f .github/world_cache_021_patch.py .github/workflows/one-shot-world-cache-021.yml
          git add -A
          git diff --cached --check
          git commit -m 'Rename Bridge runtime to Export Worker for 0.2.1'
          git push origin HEAD:main
