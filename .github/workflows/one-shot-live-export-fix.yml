name: One Shot Live Export Fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-live-export-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patches
        run: |
          python3 -m py_compile .github/export_lifecycle_patch.py .github/live_export_fix.py
          python3 .github/export_lifecycle_patch.py
          python3 .github/live_export_fix.py
          git diff --check

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - name: Install Slint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Test desktop
        working-directory: desktop
        env:
          MINESPORT_FAST_CHECK: "1"
        run: |
          cargo check --locked --all-targets
          cargo test --locked --all-targets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test engine
        working-directory: engine
        run: bash ./gradlew --no-daemon test

      - name: Commit tested source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            desktop/src/app.rs \
            desktop/src/ipc.rs \
            engine/src/main/java/dev/kastrick/minesport/IpcMode.java \
            engine/src/main/java/dev/kastrick/minesport/export/FlatterOptimizer.java \
            engine/src/main/java/dev/kastrick/minesport/export/ObjExporter.java \
            engine/src/main/java/dev/kastrick/minesport/export/GltfExporter.java \
            engine/src/main/java/dev/kastrick/minesport/resolver/ResolverChain.java
          git diff --cached --check
          git commit -m "Fix live export progress and lifecycle"
          git push origin HEAD:main
