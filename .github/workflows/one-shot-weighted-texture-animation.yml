name: One Shot Weighted Texture Animation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-weighted-texture-animation.yml"
      - ".github/weighted_texture_animation_fix.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: |
          python3 -m py_compile .github/weighted_texture_animation_fix.py
          python3 .github/weighted_texture_animation_fix.py
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "22"

      - name: Test Java engine
        working-directory: engine
        run: bash ./gradlew --no-daemon test

      - name: Commit tested source fix and remove one-shot gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engine/src/main/java/dev/kastrick/minesport/export/TextureAnimationExporter.java \
            engine/src/test/java/dev/kastrick/minesport/export/TextureAnimationWeightedVariantTest.java
          git rm \
            .github/weighted_texture_animation_fix.py \
            .github/workflows/one-shot-weighted-texture-animation.yml
          git diff --cached --check
          git commit -m "FIX | BUG-067 Discover weighted texture animations"
          git push origin HEAD:main
