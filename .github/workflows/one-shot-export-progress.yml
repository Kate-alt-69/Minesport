name: One Shot Export Progress Fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/one-shot-export-progress.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Apply source patch
        run: python .github/export_progress_patch.py

      - name: Test Java engine
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test --stacktrace

      - name: Check Rust and Slint desktop
        run: cargo check --manifest-path desktop/Cargo.toml

      - name: Verify patch
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "desktop/ui/minesport-loader.slint engine/src/main/java/dev/kastrick/minesport/IpcMode.java engine/src/main/java/dev/kastrick/minesport/region/RegionReader.java engine/src/main/java/dev/kastrick/minesport/safety/WorldCopier.java "

      - name: Publish tested fix
        run: |
          rm -f .github/export_progress_patch.py
          rm -f .github/workflows/one-shot-export-progress.yml
          rm -f .github/workflows/one-shot-litematic-ticks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix export progress and selected-region performance'
          git push origin HEAD:main
