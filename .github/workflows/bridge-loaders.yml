name: Minesport Loader Bridges

on:
  push:
    branches: [main]
    paths:
      - 'bridge-forge/**'
      - 'bridge-neoforge/**'
      - 'bridge-quilt/**'
      - 'bridge-loader-versions/**'
      - 'desktop/src/bridge_family.rs'
      - '.github/workflows/bridge-loaders.yml'
  workflow_dispatch:

jobs:
  canonical-1-21-10:
    name: ${{ matrix.name }} Bridge · Minecraft 1.21.10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Forge
            slug: forge
            project: bridge-forge
          - name: NeoForge
            slug: neoforge
            project: bridge-neoforge
          - name: Quilt
            slug: quilt
            project: bridge-quilt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build canonical bridge
        working-directory: ${{ matrix.project }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain build
      - name: Verify bridge JAR
        working-directory: ${{ matrix.project }}
        run: |
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print
      - name: Upload bridge JAR
        uses: actions/upload-artifact@v4
        with:
          name: minesport-bridge-${{ matrix.slug }}-1.21.10
          path: |
            ${{ matrix.project }}/build/libs/*.jar
            !${{ matrix.project }}/build/libs/*-sources.jar
            !${{ matrix.project }}/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14
