name: Minesport Loader Bridges

on:
  push:
    branches: [main]
    paths:
      - 'bridge-forge/**'
      - 'bridge-neoforge/**'
      - 'bridge-quilt/**'
      - '.github/workflows/bridge-loaders.yml'
  workflow_dispatch:

jobs:
  canonical-1-21-10:
    name: ${{ matrix.name }} Bridge · Minecraft 1.21.10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Forge
            project: bridge-forge
          - name: NeoForge
            project: bridge-neoforge
          - name: Quilt
            project: bridge-quilt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build canonical bridge
        working-directory: ${{ matrix.project }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain build
