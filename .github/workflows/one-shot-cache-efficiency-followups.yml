name: One Shot Cache Efficiency Followups

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: one-shot-cache-efficiency-followups
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.head_commit.message == 'CHORE | run cache efficiency followups'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Install desktop test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev xvfb

      - name: Restore embedded engine artifact
        uses: actions/download-artifact@v7
        with:
          name: minesport-engine-ci
          path: engine/build/libs
          run-id: 33797953559
          github-token: ${{ github.token }}

      - name: Restore embedded loader bridges
        uses: actions/download-artifact@v7
        with:
          name: loader-bridges-1.21.10
          path: dist/bundled-export-worker
          run-id: 33797953559
          github-token: ${{ github.token }}

      - name: Validate scoped registry superset reuse
        shell: bash
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          set -euo pipefail
          python .github/patches/apply-runtime-scope-superset.py
          rustfmt --edition 2024 desktop/src/runtime_cache.rs
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml runtime_cache::tests::full_scope_satisfies_every_scoped_request_but_not_the_reverse
          grep -Fq 'available.iter().any' desktop/src/runtime_cache.rs
          git reset --hard HEAD

      - name: Validate heightmap region identity
        shell: bash
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          set -euo pipefail
          python .github/patches/apply-heightmap-region-fingerprint.py
          rustfmt --edition 2024 desktop/src/heightmap_cache.rs
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml heightmap_cache::tests
          cargo check --locked --release --manifest-path desktop/Cargo.toml --all-targets
          grep -Fq 'minesport-heightmap-fingerprint-v2' desktop/src/heightmap_cache.rs
          grep -Fq 'REGION_HEADER_BYTES' desktop/src/heightmap_cache.rs
          git reset --hard HEAD

      - name: Publish rebased tested fixes
        shell: bash
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

          subjects="$(git log origin/main --format=%s)"
          max="$(printf '%s\n' "$subjects" | grep -oE 'BUG-[0-9]+' | cut -d- -f2 | sort -n | tail -1)"
          scope_bug=$(( ${max:-0} + 1 ))
          heightmap_bug=$(( scope_bug + 1 ))

          python .github/patches/apply-runtime-scope-superset.py
          rustfmt --edition 2024 desktop/src/runtime_cache.rs
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml runtime_cache::tests::full_scope_satisfies_every_scoped_request_but_not_the_reverse
          git add desktop/src/runtime_cache.rs
          git rm .github/patches/apply-runtime-scope-superset.py
          git diff --cached --check
          git commit -m "FIX | BUG-${scope_bug} Reuse superset scoped runtime registries"

          python .github/patches/apply-heightmap-region-fingerprint.py
          rustfmt --edition 2024 desktop/src/heightmap_cache.rs
          git diff --check
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml heightmap_cache::tests::region_header_bytes_participate_in_heightmap_identity
          git add desktop/src/heightmap_cache.rs
          git rm .github/patches/apply-heightmap-region-fingerprint.py
          git diff --cached --check
          git commit -m "FIX | BUG-${heightmap_bug} Include region headers in heightmap cache identity"

          echo 'Tracked state before final publisher cleanup:'
          git status --short
          git restore --staged --worktree .
          echo 'Tracked state after final publisher cleanup:'
          git status --short
          git pull --rebase origin main
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml runtime_cache::tests::full_scope_satisfies_every_scoped_request_but_not_the_reverse
          xvfb-run -a cargo test --locked --manifest-path desktop/Cargo.toml heightmap_cache::tests::region_header_bytes_participate_in_heightmap_identity
          git push origin HEAD:main
