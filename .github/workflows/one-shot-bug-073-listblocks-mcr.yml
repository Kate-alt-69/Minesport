name: One Shot BUG-073 listBlocks Legacy Regions

on:
  push:
    branches:
      - main
    paths:
      - ".github/bug_073_listblocks_mcr.py"
      - ".github/workflows/one-shot-bug-073-listblocks-mcr.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: |
          python3 -m py_compile .github/bug_073_listblocks_mcr.py
          python3 .github/bug_073_listblocks_mcr.py
          git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test Java engine
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace test
      - name: Commit tested source fix and remove one-shot gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/main/java/dev/kastrick/minesport/IpcMode.java
          git rm \
            .github/bug_073_listblocks_mcr.py \
            .github/workflows/one-shot-bug-073-listblocks-mcr.yml
          git diff --cached --check
          git commit -m "FIX | BUG-073 Support legacy regions in block lists"
          git push origin HEAD:main
