name: One Shot Engine Update Coordination

on:
  push:
    branches: [main]
    paths:
      - ".github/engine_update_coordination_patch.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Patch cross-process engine coordination
        shell: pwsh
        run: python .github/engine_update_coordination_patch.py

      - name: Remove one-shot integration files
        shell: pwsh
        run: |
          Remove-Item -Force .github/engine_update_coordination_patch.py
          Remove-Item -Force .github/workflows/one-shot-engine-update-coordination.yml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt

      - name: Format and validate source patch
        shell: pwsh
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml
          git diff --check
          if (-not (Test-Path desktop/src/engine_lease.rs)) { throw 'engine lease module missing' }
          if (-not (Select-String -Quiet -Path desktop/src/engine_update.rs -SimpleMatch 'EngineStagedUpdateDeferredInUse')) { throw 'staged apply engine-use fence missing' }
          if (-not (Select-String -Quiet -Path desktop/src/engine_update.rs -SimpleMatch 'EngineUpdateCheckBusy')) { throw 'background stage fence missing' }
          if (-not (Select-String -Quiet -Path desktop/src/ipc.rs -SimpleMatch '_engine_use_lease')) { throw 'GUI engine-use lease ownership missing' }
          if (-not (Select-String -Quiet -Path desktop/src/bin/minesport-engine.rs -SimpleMatch 'acquire_engine_use_shared')) { throw 'sidecar orphan-use lease missing' }

      - name: Test Windows lock and engine lifecycle
        shell: pwsh
        env:
          MINESPORT_FAST_CHECK: '1'
        run: |
          cargo test --locked --manifest-path desktop/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Windows all-target tests failed' }
          cargo check --locked --release --manifest-path desktop/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Windows release check failed' }

      - name: Commit tested fix with collision-free ID
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked -m engine-update-coordination
          git pull --rebase origin main
          git stash pop
          $subjects = git log origin/main --format=%s
          $ids = [regex]::Matches(($subjects -join "`n"), 'BUG-(\d+)') | ForEach-Object { [int]$_.Groups[1].Value }
          $maxId = if ($ids) { ($ids | Measure-Object -Maximum).Maximum } else { 0 }
          $bugId = $maxId + 1
          git add desktop/src/engine_lease.rs desktop/src/engine_update.rs desktop/src/ipc.rs desktop/src/main.rs desktop/src/bin/minesport-engine.rs .github/engine_update_coordination_patch.py .github/workflows/one-shot-engine-update-coordination.yml
          git diff --cached --check
          git commit -m "FIX | BUG-$bugId Serialize engine update and use"
          git push origin HEAD:main
