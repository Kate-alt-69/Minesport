name: One Shot BUG-077 Heightmap Layout Safety

on: [push]

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply source patch
        run: python3 .github/bug077_heightmap_patch.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test Java engine
        run: |
          cd engine
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Commit tested source fix and remove one-shot gate
        if: success()
        run: |
          rm -f .github/workflows/one-shot-bug-077-heightmap-layout.yml
          rm -f .github/bug077_heightmap_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/src/main/java/dev/kastrick/minesport/region/HeightmapGenerator.java \
                  engine/src/main/java/dev/kastrick/minesport/IpcMode.java \
                  engine/src/test/java/dev/kastrick/minesport/region/HeightmapGeneratorLayoutTest.java \
                  .github/workflows/one-shot-bug-077-heightmap-layout.yml \
                  .github/bug077_heightmap_patch.py
          git commit -m 'FIX | BUG-077 Bound heightmap raster allocation'
          git push origin HEAD:main
